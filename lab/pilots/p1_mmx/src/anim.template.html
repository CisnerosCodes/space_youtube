<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal Delay P1 MMX</title>
<!-- build: __BUILDINFO__ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;family=IBM+Plex+Mono:wght@500&amp;display=block" rel="stylesheet">
<style>
  :root { --ink: #0B0B0C; --paper: #F2EFE8; --amber: #F5B83D; --muted: #8C8A85; }
  html, body { margin: 0; background: var(--ink); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); color: var(--paper); font-family: 'Archivo', sans-serif; }
  canvas, .layer { position: absolute; left: 0; top: 0; }
  .mono { font-family: 'IBM Plex Mono', monospace; font-weight: 500; }
  .box { background: var(--ink); white-space: nowrap; }
  .giant { position: absolute; left: 40px; display: none; font-weight: 800; font-stretch: 112%; text-transform: uppercase; white-space: nowrap;
           transform-origin: 0 50%; color: var(--amber); font-variant-numeric: tabular-nums; line-height: 0.88; }
  .gdata { position: absolute; left: 80px; display: none; font-size: 28px; line-height: 36px; color: var(--paper); white-space: nowrap; }
  .gdata .u { color: var(--muted); }
  #caps { position: absolute; left: 80px; top: 1196px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .line { padding: 8px 16px; background: rgba(11,11,12,0.88); font-weight: 700; font-stretch: 100%; font-size: 90px; line-height: 96px; white-space: nowrap; }
  .w { color: var(--paper); }
  .w.on { color: var(--amber); }
  .lab { position: absolute; display: none; padding: 4px 10px; font-size: 28px; line-height: 36px; letter-spacing: 0.05em; }
  #next > * { position: absolute; display: none; }
  #catWrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; isolation: isolate; pointer-events: none; }
  #catWrap svg { position: absolute; left: 0; top: 0; display: none; overflow: visible; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="pic" width="1080" height="1920"></canvas>
  <svg class="layer" width="0" height="0" aria-hidden="true"><defs id="fdefs"></defs></svg>

  <!-- giant numbers and words (amber on ink) -->
  <div class="giant" id="g6" style="top: 314px; font-size: 340px">6 FT</div>
  <div class="gdata mono box" id="g6d" style="top: 632px; padding: 6px 12px">1.8 M <span class="u">·</span> EVERY 100 YEARS</div>
  <div class="giant" id="g50" style="top: 314px; font-size: 340px">50</div>
  <div class="gdata mono box" id="g50d" style="top: 632px; padding: 6px 12px">MILLION YEARS</div>
  <div class="giant" id="gMon" style="top: 314px; font-size: 340px">MON</div>
  <div class="gdata mono box" id="gMond" style="top: 632px; padding: 6px 12px">19 OCT</div>
  <div class="giant" id="gMmx" style="top: 314px; font-size: 340px">MMX</div>

  <!-- moon labels on the two-moons beat -->
  <div class="lab mono box" id="labP">PHOBOS</div>
  <div class="lab mono box" id="labD">DEIMOS</div>

  <!-- NEXT card text (the line art lives on the canvas) -->
  <div id="next" class="layer" style="width: 1080px; height: 1920px">
    <div id="nHead" style="left: 80px; top: 330px; font-weight: 800; font-stretch: 112%; font-size: 88px; line-height: 84px; text-transform: uppercase; white-space: nowrap; color: var(--paper)">MMX lifts off</div>
    <div id="nDate" class="mono" style="left: 80px; top: 446px; font-size: 64px; line-height: 64px; color: var(--amber); white-space: nowrap">MON 19 OCT</div>
    <div id="nData" class="mono" style="left: 80px; top: 528px; font-size: 28px; line-height: 36px; white-space: nowrap; color: var(--paper)">H3 ROCKET <span style="color: var(--muted)">·</span> TANEGASHIMA</div>
    <div id="nPoint" class="mono" style="left: 80px; top: 960px; padding: 10px 18px 10px 14px; border: 2px solid var(--amber); background: var(--ink); font-size: 28px; line-height: 38px; white-space: nowrap; color: var(--paper)">
      <div style="display: flex; align-items: center; gap: 14px">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M3 14 H23 M15 6 L23 14 L15 22" fill="none" stroke="#F5B83D" stroke-width="3"></path></svg>
        <span><span style="color: var(--amber)">Follow</span> for the launch</span>
      </div>
    </div>
    <div id="nMark" style="left: 80px; top: 1064px; align-items: center; gap: 24px">
      <svg width="104" height="44" viewBox="0 0 104 44" aria-hidden="true" style="overflow: visible">
        <circle id="nDot" cx="22" cy="22" r="22" fill="#F5B83D" style="transform-box: fill-box; transform-origin: center"></circle>
        <circle id="nRing" cx="82" cy="22" r="19" fill="none" stroke="#F5B83D" stroke-width="6" style="transform-box: fill-box; transform-origin: center"></circle>
      </svg>
      <div id="nWord" style="font-weight: 800; font-stretch: 125%; font-size: 64px; line-height: 64px; text-transform: uppercase; white-space: nowrap; color: var(--paper)">Signal <span style="color: var(--amber)">Delay</span></div>
    </div>
  </div>

  <!-- series kicker: identical on every frame; reads NEXT ON LAUNCH DAY on the NEXT card -->
  <div class="mono box" id="kicker" style="position: absolute; left: 80px; top: 246px; display: flex; align-items: center; gap: 12px; padding: 8px 16px 8px 12px; font-size: 28px; line-height: 36px; text-transform: uppercase">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3 L26 25 H2 Z" fill="#F5B83D"></path></svg>
    <span id="kText">Launch day</span>
  </div>

  <!-- signal delay chip: Mars, Oct. 19, 2026, JPL Horizons one-way light time 12 min 43 s -->
  <div class="mono box" id="chip" style="position: absolute; left: 80px; top: 302px; display: none; align-items: center; gap: 14px; padding: 8px 16px 8px 12px; font-size: 28px; line-height: 36px">
    <svg width="47.27" height="20" viewBox="0 0 104 44" aria-hidden="true" style="overflow: visible">
      <circle cx="22" cy="22" r="22" fill="#F5B83D"></circle>
      <circle id="chipRing" cx="82" cy="22" r="19" fill="none" stroke="#F5B83D" stroke-width="6" style="transform-box: fill-box; transform-origin: center"></circle>
    </svg>
    <span>SIGNAL DELAY</span><span style="color: var(--amber)">MARS 12 min 43 s</span>
  </div>

  <div id="caps"></div>

  <!-- mascot (v3 actor), in frame pixels; motion blur = sub-frame samples added with plus-lighter -->
  <div id="catWrap"></div>

  <!-- credit slot: the photo credit, or the source of the facts on a line-art beat -->
  <div class="mono box" id="credit" style="position: absolute; left: 80px; top: 1458px; display: none; padding: 6px 12px; font-size: 24px; line-height: 28px"></div>
</div>

<script>
const SCHEDULE = /*__CAPTIONS__*/null;
const IMAGES = /*__IMAGES__*/null;
/*__RIG__*/
(() => {
  // ================================================================ constants
  const FPS = 30;
  const NV = Math.ceil(SCHEDULE.duration * FPS - 1e-6);       // narration length in whole frames
  const HOLD = 21;                                             // finished wordmark held for the sonic logo (0.7 s)
  const NF = NV + HOLD, LAST = NF - 1;
  const C = { ink: '#0B0B0C', paper: '#F2EFE8', amber: '#F5B83D', muted: '#8C8A85' };
  const CR = {
    hirise: 'NASA/JPL-Caltech/University of Arizona',
    viking: 'NASA/JPL/USGS',
    marsMoons: 'NASA/JPL/USGS, NASA/JPL-Caltech/University of Arizona',
    nasa: 'Source: NASA',
    jaxa: 'Source: JAXA',
    ll2: 'Source: Launch Library 2',
  };

  // ================================================================ easing, springs, noise
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t, sy = (t) => ((ay * t + by) * t + cy) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    return (x) => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break; t -= e / d; }
      let lo = 0, hi = 1;
      for (let i = 0; i < 30 && Math.abs(sx(t) - x) > 1e-6; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; }
      return sy(t);
    };
  }
  const enter = bezier(0.16, 1, 0.3, 1), move = bezier(0.76, 0, 0.24, 1), exitE = bezier(0.7, 0, 0.84, 0);
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const elerp = (a, b, t) => a * Math.pow(b / a, t);          // for scales
  const k = (f, a, d, e = (x) => x) => e(clamp01((f - a) / d));
  function spring(t, zeta, fr) {
    if (t <= 0) return 0;
    const w = 2 * Math.PI * fr, wd = w * Math.sqrt(1 - zeta * zeta);
    return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta * w / wd) * Math.sin(wd * t));
  }
  const sp = (df, zeta = 0.7, fr = 4) => (df <= 0 ? 0 : spring(df / FPS, zeta, fr));
  const punch = (f, list, amt = 0.04) => list.reduce((p, pf) => p * (1 + amt * sp(f - pf)), 1);
  function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  // ================================================================ timing from the caption schedule
  const W = SCHEDULE.words.map((w) => ({ ...w, f: Math.round(w.start * FPS), fe: Math.round(w.end * FPS), key: w.text.toLowerCase().replace(/[^a-z0-9]/g, '') }));
  function at(re, from = 0) {
    for (let i = Math.max(0, from); i < W.length; i++) if (re.test(W[i].key)) return i;
    throw new Error('anchor not found: ' + re + ' after word ' + from);
  }
  const I = {};
  I.falling = at(/^falling$/);
  I.slowly = at(/^slowly$/);
  I.phobos1 = at(/^phobos$/, I.slowly);
  I.drops = at(/^drops$/, I.phobos1);
  I.six = at(/^(six|6)$/, I.drops);
  I.closer = at(/^closer$/, I.six);
  I.years1 = at(/^years$/, I.closer);
  I.in = I.years1 + 1;
  I.fifty = at(/^(fifty|50)$/, I.in);
  I.million = at(/^million$/, I.fifty);
  I.crashes = at(/^crash/, I.million);
  I.mars3 = at(/^mars$/, I.crashes);
  I.or = at(/^or$/, I.mars3);
  I.shatters = at(/^shatter/, I.or);
  I.ring = at(/^ring$/, I.shatters);
  I.and1 = I.ring + 1;
  I.monday1 = at(/^monday$/, I.and1);
  I.japan1 = at(/^japan$/, I.monday1);
  I.go = at(/^go$/, I.monday1);
  I.piece = at(/^piece$/, I.go);
  I.it2 = at(/^called$/, I.piece) - 2;          // "It is called MMX"
  I.mmx = at(/^mmx$/, I.it2);
  I.land = at(/^land$/, I.mmx);
  I.phobos2 = at(/^phobos$/, I.land);
  I.scoop = at(/^scoop$/, I.phobos2);
  I.sample1 = at(/^sample$/, I.scoop);
  I.fly = at(/^fly$/, I.sample1);
  I.home = at(/^home$/, I.fly);
  I.no = I.home + 1;
  I.mars4 = at(/^mars$/, I.no);
  I.or2 = at(/^or$/, I.mars4);
  I.moons1 = at(/^moons$/, I.or2);
  I.why = at(/^why$/, I.moons1);
  I.bother = at(/^bother$/, I.why);
  I.nobody = at(/^nobody$/, I.bother);
  I.these = at(/^these$/, I.nobody);
  I.moons2 = at(/^moons$/, I.these);
  I.that2 = at(/^that$/, I.moons2);
  I.sample2 = at(/^sample$/, I.that2);
  I.finally = at(/^finally$/, I.sample2);
  I.tell = at(/^tell$/, I.finally);
  I.liftoff = at(/^liftoff$/, I.tell);
  I.monday2 = at(/^monday$/, I.liftoff);
  I.h3 = at(/^h3$/, I.monday2);
  I.follow = at(/^follow$/, I.h3);
  I.we = at(/^we$/, I.follow);
  I.show = at(/^show$/, I.we);
  I.launch = at(/^launch$/, I.show);
  const F = {};
  for (const [name, i] of Object.entries(I)) F[name] = W[i].f;
  F.end = LAST;
  const FE = (name) => W[I[name]].fe;
  const T = (name) => W[I[name]].start;            // seconds, for the cat's timeline

  // ================================================================ images and parallax layers
  const PH = {
    phobosA: { cx: 0.522, cy: 0.501, body: 0.94, layers: [[0.53, 0.5, 0.34, 1.0], [0.62, 0.42, 0.14, 1.7]] },
    phobosB: { cx: 0.519, cy: 0.561, body: 0.962, layers: [[0.55, 0.62, 0.34, 1.0], [0.5, 0.48, 0.14, 1.6]] },
    deimos: { cx: 0.486, cy: 0.498, body: 0.886, layers: [] },
    mars: { cx: 0.5, cy: 0.5, body: 1.0, layers: [[0.5, 0.5, 0.34, 1.0], [0.45, 0.58, 0.14, 1.5]] },
  };
  const imgPromises = [];
  for (const [name, P] of Object.entries(PH)) {
    const im = new Image(); im.src = IMAGES[name]; P.img = im;
    imgPromises.push(im.decode().then(() => {
      P.w = im.naturalWidth; P.h = im.naturalHeight; P.bodyPx = P.body * P.w;
      P.lay = P.layers.map(([mx, my, r, d]) => {
        const c = document.createElement('canvas'); c.width = P.w; c.height = P.h;
        const g = c.getContext('2d'); g.drawImage(im, 0, 0);
        g.globalCompositeOperation = 'destination-in';
        const R = r * P.w, gr = g.createRadialGradient(mx * P.w, my * P.h, R * 0.35, mx * P.w, my * P.h, R);
        gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr; g.fillRect(0, 0, P.w, P.h);
        return { c, d };
      });
    }));
  }

  // ================================================================ canvas drawing helpers
  const pic = document.getElementById('pic'), pctx = pic.getContext('2d');
  const mk = () => { const c = document.createElement('canvas'); c.width = 1080; c.height = 1920; return c; };
  const tmp = mk(), tctx = tmp.getContext('2d'), acc = mk(), actx = acc.getContext('2d');
  let PROBE = null;              // when an array, helpers record tracked points instead of drawing
  const track = (...pts) => { if (PROBE) for (let i = 0; i < pts.length; i += 2) PROBE.push(pts[i], pts[i + 1]); return !!PROBE; };

  function photo(g, P, o) {
    const s = o.s, x = o.x, y = o.y;
    if (track(x, y, x + (P.w * s) / 2, y)) return;
    const rot = ((o.rot || 0) * Math.PI) / 180, push = o.push || 0, [dx, dy] = o.drift || [0, 0];
    g.save(); g.globalAlpha = o.alpha ?? 1;
    const ax = P.cx * P.w, ay = P.cy * P.h;
    const one = (src, d) => {
      g.save(); g.translate(x + dx * d, y + dy * d); g.rotate(rot); const ss = s * (1 + push * d); g.scale(ss, ss);
      g.drawImage(src, -ax, -ay); g.restore();
    };
    one(P.img, 0);
    if (P.lay) for (const L of P.lay) one(L.c, L.d);
    g.restore();
  }
  function photoPt(P, o, nx, ny) {
    const rot = ((o.rot || 0) * Math.PI) / 180, s = o.s;
    const px = (nx - P.cx) * P.w * s, py = (ny - P.cy) * P.h * s;
    return [o.x + px * Math.cos(rot) - py * Math.sin(rot), o.y + px * Math.sin(rot) + py * Math.cos(rot)];
  }
  function dot(g, x, y, r = 11, color = C.amber, alpha = 1) {
    if (track(x, y)) return;
    g.save(); g.globalAlpha = alpha; g.fillStyle = color; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); g.restore();
  }
  function ring(g, x, y, r, w = 4, alpha = 1, dash = null) {
    if (track(x, y, x + r, y)) return;
    g.save(); g.globalAlpha = alpha; g.strokeStyle = C.amber; g.lineWidth = w; if (dash) g.setLineDash(dash);
    g.beginPath(); g.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); g.stroke(); g.restore();
  }

  // ---- flat line art: primitives that draw on by length
  const Lp = (x1, y1, x2, y2) => ({ t: 'P', pts: [[x1, y1], [x2, y2]] });
  const Pp = (...pts) => ({ t: 'P', pts });
  const Ap = (cx, cy, rx, ry, a0, a1) => ({ t: 'A', cx, cy, rx, ry, a0, a1 });
  function plen(p) {
    if (p.t === 'P') { let s = 0; for (let i = 1; i < p.pts.length; i++) s += Math.hypot(p.pts[i][0] - p.pts[i - 1][0], p.pts[i][1] - p.pts[i - 1][1]); return s; }
    let s = 0, px, py; for (let i = 0; i <= 32; i++) { const a = p.a0 + (p.a1 - p.a0) * (i / 32), x = p.cx + p.rx * Math.cos(a), y = p.cy + p.ry * Math.sin(a); if (i) s += Math.hypot(x - px, y - py); px = x; py = y; } return s;
  }
  function pdraw(g, p, u) {
    if (u <= 0) return;
    g.beginPath();
    if (p.t === 'A') { g.ellipse(p.cx, p.cy, p.rx, p.ry, 0, p.a0, p.a0 + (p.a1 - p.a0) * Math.min(1, u)); g.stroke(); return; }
    const L = p.len ?? (p.len = plen(p)); let left = L * Math.min(1, u);
    g.moveTo(p.pts[0][0], p.pts[0][1]);
    for (let i = 1; i < p.pts.length && left > 0; i++) {
      const [x0, y0] = p.pts[i - 1], [x1, y1] = p.pts[i], d = Math.hypot(x1 - x0, y1 - y0);
      if (d <= left) { g.lineTo(x1, y1); left -= d; } else { g.lineTo(x0 + ((x1 - x0) * left) / d, y0 + ((y1 - y0) * left) / d); left = 0; }
    }
    g.stroke();
  }
  function art(g, items, f, xf, opt = {}) {
    if (track(xf.x, xf.y, xf.x + 100 * xf.s, xf.y)) return;
    g.save(); g.translate(xf.x, xf.y); g.rotate(((xf.rot || 0) * Math.PI) / 180); g.scale(xf.s, xf.s);
    g.strokeStyle = opt.color || C.amber; g.lineWidth = (opt.w || 4) / xf.s; g.lineCap = 'butt'; g.lineJoin = 'miter';
    if (opt.dash) g.setLineDash(opt.dash.map((v) => v / xf.s));
    for (const [p, a, d] of items) pdraw(g, p, a == null ? 1 : k(f, a, d, enter));
    g.restore();
  }
  function inkCircle(g, x, y, r, u = 1) {
    if (track(x, y, x + r, y)) return;
    g.save(); g.fillStyle = C.ink; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    g.strokeStyle = C.amber; g.lineWidth = 4; g.beginPath(); g.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * u); g.stroke(); g.restore();
  }

  // ================================================================ drawings
  // MMX spacecraft (simplified flat drawing, not to any published drawing): bus, two solar wings,
  // a dish, four legs, the return capsule on top (the amber dot, drawn separately), a sampler arm.
  function mmxItems(a) {
    return [
      [Pp([-70, -60], [70, -60], [70, 60], [-70, 60], [-70, -60]), a, 10],
      [Lp(-70, -18, 70, -18), a + 5, 6],
      [Lp(-70, 0, -112, 0), a + 6, 4], [Lp(70, 0, 112, 0), a + 7, 4],
      [Pp([-112, -36], [-332, -36], [-332, 36], [-112, 36], [-112, -36]), a + 8, 10],
      [Pp([112, -36], [332, -36], [332, 36], [112, 36], [112, -36]), a + 11, 10],
      [Lp(-185, -36, -185, 36), a + 13, 4], [Lp(-258, -36, -258, 36), a + 14, 4],
      [Lp(185, -36, 185, 36), a + 15, 4], [Lp(258, -36, 258, 36), a + 16, 4],
      [Lp(-62, 60, -114, 150), a + 14, 6], [Lp(-130, 150, -98, 150), a + 18, 3],
      [Lp(62, 60, 114, 150), a + 15, 6], [Lp(98, 150, 130, 150), a + 19, 3],
      [Lp(-24, 60, -34, 132), a + 16, 5], [Lp(24, 60, 34, 132), a + 17, 5],
      [Lp(-40, -60, -40, -70), a + 16, 2], [Ap(-40, -78, 28, 11, 0, Math.PI), a + 17, 6],
    ];
  }
  // H3-24 (simplified): core stage, fairing, four SRB-3 boosters (two show on each side), two LE-9 bells
  function ogive(x0, y0, x1, y1, tipY) { const pts = []; for (let i = 0; i <= 12; i++) { const u = i / 12, x = lerp(x0, x1, u); pts.push([x, y0 - (y0 - tipY) * Math.sin(Math.PI * u)]); } return pts; }
  function h3Items(a) {
    return [
      [Pp([-34, 0], [-34, -440], [34, -440], [34, 0], [-34, 0]), a, 12],
      [Lp(-34, -300, 34, -300), a + 6, 4],
      [Pp([-37, -440], [-37, -520]), a + 6, 4], [Pp([37, -440], [37, -520]), a + 6, 4],
      [Pp(...ogive(-37, -520, 37, -520, -598)), a + 8, 8],
      [Pp([-34, -8], [-62, -8], [-62, -176], ...ogive(-62, -176, -34, -176, -214).slice(0, 13), [-34, -176]), a + 9, 9],

  const MARS_D = 2700;
  const marsHook = (f) => { const fall = hookFall(f); return { x: 540, y: 1470 + MARS_D / 2 - 26 * fall, s: (MARS_D / PH.mars.bodyPx) * (1 + 0.015 * fall), push: 0.05 * fall, rot: 0 }; };
  const M0 = F.phobos1 - 3, MD = 16;   // photo -> dot morph

  // ================================================================ picture with motion blur

  // ================================================================ DOM layers
  const $ = (id) => document.getElementById(id);

  const fdefs = $('fdefs');
  function blurFilter(el) {

    const fe = blurFilter(el), sx = Math.min(40, Math.abs(vx) * 0.35), sy = Math.min(60, Math.abs(vy) * 0.35);
    if (sx < 0.3 && sy < 0.3) { el.style.filter = 'none'; return; }
    fe.setAttribute('stdDeviation', `${sx.toFixed(2)} ${sy.toFixed(2)}`); el.style.filter = `url(#mb_${el.id})`;
  }
  const slam = (df) => 1.12 - 0.12 * enter(clamp01(df / 5));
  function giant(id, f, a, b, exitDir = -1, exitLen = 8) {
    const el = $(id), on = f >= a && f < b + exitLen;
    show(el, on); if (!on) return;
    const ex = (q) => exitDir * 1100 * k(q, b, exitLen, exitE);
    const dy = ex(f), vy = dy - ex(f - 1);
    el.style.transform = `translateY(${dy.toFixed(1)}px) scale(${slam(f - a).toFixed(4)})`;
    setBlur(el, 0, vy);
  }
  function gdata(id, f, a, b, exitDir = -1, exitLen = 8) {
    const el = $(id), on = f >= a && f < b + exitLen;
    show(el, on); if (!on) return;
    const ex = (q) => exitDir * 1100 * k(q, b, exitLen, exitE);
    const dy = ex(f); el.style.transform = `translateY(${dy.toFixed(1)}px)`; setBlur(el, 0, dy - ex(f - 1));
  }
  const ringEl = (el, df) => {
    el.style.opacity = df < 0 ? 0 : clamp01((df + 1) / 3);
    el.style.transform = `scale(${(0.4 + 0.6 * sp(Math.max(0, df))).toFixed(4)})`;
  };

  // ---- captions: chunks from the schedule, measured with the real font
  let CHUNKS = [];
  const GLUE = /^(a|an|the|to|of|on|in|into|and|or|is|its|it|from|that|these|six|fifty|hundred|go|up)$/i;
  const CAP_TOP = 1196, LINE_H = 112, LINE_GAP = 8;
  function buildChunks() {
    const m = document.createElement('canvas').getContext('2d');
    m.font = "700 90px 'Archivo'";
    const wid = (ws) => m.measureText(ws.map((w) => w.text).join(' ')).width;
    const MAXW = 820 - 32;
    const segs = []; let cur = [];
    W.forEach((w, i) => {
      const prev = W[i - 1];
      if (cur.length && ((prev && /[.?!:]$/.test(prev.text)) || (prev && w.start - prev.end > 0.45))) { segs.push(cur); cur = []; }
      cur.push(w);
    });
    if (cur.length) segs.push(cur);
    const chunks = [];
    for (const sg of segs) {
      const n = sg.length, best = new Array(n + 1).fill(Infinity), from = new Array(n + 1).fill(-1); best[0] = 0;
      for (let i = 1; i <= n; i++) for (let j = Math.max(0, i - 4); j < i; j++) {
        const ws = sg.slice(j, i), w = wid(ws); if (w > MAXW || best[j] === Infinity) continue;
        let c = i === n ? 0.3 * ((MAXW - w) / 100) ** 2 : ((MAXW - w) / 100) ** 2;
        if (ws.length === 1 && n > 1) c += 40;
        if (i < n && /,$/.test(sg[i - 1].text)) c -= 12;
        if (ws.slice(0, -1).some((x) => /,$/.test(x.text))) c += 18;
        if (i < n && GLUE.test(sg[i - 1].text)) c += 30;
        if (i < n && /^(six|fifty|hundred|\d+)$/i.test(sg[i - 1].text)) c += 60;   // never split a number from its unit
        if (best[j] + c < best[i]) { best[i] = best[j] + c; from[i] = j; }
      }
      const lines = []; for (let i = n; i > 0; i = from[i]) lines.unshift(sg.slice(from[i], i));
      const L = lines.length, cb = new Array(L + 1).fill(Infinity), cf = new Array(L + 1).fill(-1); cb[0] = 0;
      for (let i = 1; i <= L; i++) for (let j = Math.max(0, i - 2); j < i; j++) {
        let c = i - j === 1 ? (L === 1 ? 0 : 10 + (lines[j].length === 1 ? 30 : 0)) : 0;
        if (cb[j] + c < cb[i]) { cb[i] = cb[j] + c; cf[i] = j; }
      }
      const grp = []; for (let i = L; i > 0; i = cf[i]) grp.unshift(lines.slice(cf[i], i));
      for (const g of grp) chunks.push({ lines: g });
    }
    chunks.forEach((c) => { c.f0 = c.lines[0][0].f; c.lastW = c.lines[c.lines.length - 1].slice(-1)[0]; });
    chunks.forEach((c, j) => {
      const nxt = chunks[j + 1];
      c.f1 = !nxt ? LAST + 1 : nxt.f0 - c.lastW.fe > 30 ? c.lastW.fe + 24 : nxt.f0;
      // full line boxes (for the cat's lint and placement): text width + padding, 112 px tall, 8 px apart
      c.rects = c.lines.map((ln, li) => [80, CAP_TOP + li * (LINE_H + LINE_GAP), Math.ceil(wid(ln)) + 32, LINE_H]);
      c.el = document.createElement('div'); c.el.style.cssText = 'display:none;flex-direction:column;align-items:flex-start;gap:8px';
      c.lineEls = c.lines.map((ln) => {
        const le = document.createElement('div'); le.className = 'line';
        ln.forEach((w, q) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = (q ? ' ' : '') + w.text; le.appendChild(s); w.el = s; });
        c.el.appendChild(le); return le;
      });
      $('caps').appendChild(c.el);
    });
    CHUNKS = chunks;
  }
  function renderCaptions(f) {
    for (const c of CHUNKS) {
      const on = f >= c.f0 && f < c.f1; show(c.el, on, 'flex'); if (!on) continue;
      let lastW = null;
      c.lines.forEach((ln, li) => {
        let any = false;
        ln.forEach((w) => { const v = f >= w.f; w.el.style.display = v ? 'inline' : 'none'; w.el.classList.remove('on'); if (v) { lastW = w; any = true; } });
        c.lineEls[li].style.display = any ? 'block' : 'none';
      });
      if (lastW) lastW.el.classList.add('on');
    }
  }
  const chunkAt = (f) => CHUNKS.find((c) => f >= c.f0 && f < c.f1) || null;

  // ================================================================ the cat (mascot v3 actor)
  // He is a guide and a reaction: he enters, travels between elements, reacts on the beat, talks
  // (mouth on the narration's word times while he is on screen) and idles. Never over caption words
  // or a photo's subject (checked with Actor.lint), never mirrored (the rig has no flip).
  const CAT_K = 0.3;
  const STRESS = /^(falling|six|feet|fifty|million|ring|grab|nobody|finally|slowly|liftoff|mmx)$/;
  let cat = null, CATSEG = [], SUBJ = [];
  const FLOOR = [80, CAP_TOP, 330, 1920 - CAP_TOP];    // virtual floor: the caption box top, hiding him behind it on a pop
  const POINT_BOX = [80, 960, 452, 1920 - 960];          // the NEXT card pointer box top
  function buildCat() {
    const { Actor, standOn } = M_actor;
    const words = W.map((w) => ({ w: w.text, s: w.start, e: w.end, stress: STRESS.test(w.key) }));
    const marsTop = [M.x, M.y - M.R - 2];
    const capSpot = [205, CAP_TOP - 2];
    const ptSpot = [235, POINT_BOX[1] - 2];
    const phobosHook = [hookCam(F.falling).x, hookCam(F.falling).y];
    const lensP = [LENS.P.x, LENS.P.y];
    // photo subjects the cat must never cover (core of each body while it is on screen)
    SUBJ = [
      { a: 0, b: M0, r: [360, 260, 590, 640], what: 'Phobos (hook)' },
      { a: F.mars4 + 20, b: IRIS2, r: [380, 520, 470, 450], what: 'Mars (two-moons beat)' },
      { a: F.or2 + 22, b: IRIS2, r: [LENS.P.x - LENS.P.r, LENS.P.y - LENS.P.r, 2 * LENS.P.r, 2 * LENS.P.r + 60], what: 'Phobos lens + label' },
    ];
    cat = new Actor({ scale: CAT_K, seed: 11, safe: [40, 200, 900, 1300] });
    const tl = [
      { t: -1, do: 'say', words },
      // A. hook: pops up from behind the caption, gasps at the falling moon, shrugs at "Slowly", zips off
      { t: -0.1, do: 'expr', expr: 'curious' },
      { t: -0.1, do: 'enter', how: 'pop', box: FLOOR, to: capSpot, seg: 'A' },
      { t: T('falling') - 0.08, do: 'gasp', at: phobosHook, dur: 1.0 },
      { t: T('slowly') - 0.05, do: 'shrug', dur: 1.0 },
      { t: T('phobos1') - 0.28, do: 'exit', how: 'zip', to: 'left' },
      // B. "In fifty million years": drops onto the top of the Mars drawing on a tether, gasps at the crash,
      //    WHAT at the ring, hops down to the caption as the diagram leaves, points at the H3, jets after the dot
      { t: T('in') + 0.05, do: 'expr', expr: 'keen' },
      { t: T('in') + 0.05, do: 'enter', how: 'drop', to: marsTop, seg: 'B' },
      { t: T('in') + 1.5, do: 'look', at: null },
      { t: T('crashes') - 0.1, do: 'look', at: impPt(0) },
      { t: W[I.mars3].start - 0.02, do: 'gasp', at: impPt(0), dur: 0.85 },
      { t: T('shatters') + 0.06, do: 'what', dur: 0.95 },
      { t: T('ring') + 0.25, do: 'hop', to: capSpot, height: 120 },
      { t: T('ring') + 0.25, do: 'look', at: null },
      { t: T('japan1') - 0.05, do: 'point', at: [RK.x, RK.y - 360], dur: 1.05 },
      { t: T('go') - 0.32, do: 'exit', how: 'jet', to: 'up' },
      // D1. "Why bother?": floats in from the left onto the caption, WHAT, shrugs at "nobody knows",
      //     points at the Phobos lens on "these moons", zips off as the lens opens
      { t: W[I.moons1].start - 0.6, do: 'expr', expr: 'skeptical' },
      { t: W[I.moons1].start - 0.6, do: 'enter', how: 'float', from: 'left', to: capSpot, dur: 1.55, spin: -0.6, seg: 'D1' },
      { t: T('why') + 0.02, do: 'what', dur: 0.8 },
      { t: T('nobody') - 0.05, do: 'shrug', dur: 1.0 },
      { t: T('these') - 0.12, do: 'point', at: lensP, dur: 1.0 },
      { t: T('that2') - 0.3, do: 'exit', how: 'zip', to: 'left' },
      // D2. NEXT card: skids in onto the pointer box, points at the rocket, thumbs up on "Follow",
      //     watches the launch, bounces, then idles on the card to the end
      { t: T('monday2') + 0.38, do: 'expr', expr: 'excited' },
      { t: T('monday2') + 0.38, do: 'enter', how: 'skid', from: 'left', to: ptSpot, seg: 'D2' },
      { t: T('h3') + 0.35, do: 'point', at: [NK.x, NK.y - 330], dur: 0.95 },
      { t: T('follow') - 0.04, do: 'thumbs', dur: 0.95 },
      { t: T('we') + 0.05, do: 'look', at: [NK.x, 300] },
      { t: T('launch') - 0.02, do: 'nod', count: 2, dur: 1.0 },
      { t: T('launch') + 1.0, do: 'expr', expr: 'happy' },
      { t: T('launch') + 1.0, do: 'look', at: null },
    ];
    cat.timeline(tl);
    // on-screen segments (frames), for the lint and the report
    CATSEG = [
      { id: 'A', a: 0, b: Math.round((T('phobos1') + 0.2) * FPS) },
      { id: 'B', a: Math.round((T('in') + 0.05) * FPS), b: Math.round((T('go') + 0.9) * FPS) },
      { id: 'D1', a: Math.round((W[I.moons1].start - 0.6) * FPS), b: Math.round((T('that2') + 0.2) * FPS) },
      { id: 'D2', a: Math.round((T('monday2') + 0.38) * FPS), b: LAST },
    ];
  }
  const catWrap = $('catWrap');
  const catSvgs = [];
  function catSvg(i) {
    while (catSvgs.length <= i) {
      const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      s.setAttribute('width', '1080'); s.setAttribute('height', '1920'); s.setAttribute('viewBox', '0 0 1080 1920');
      catWrap.appendChild(s); catSvgs.push(s);
    }
    return catSvgs[i];
  }
  let lastCatN = 1;
  function renderCat(f) {
    const t = f / FPS;
    const { n, shutter } = cat.blur(t);
    const N = n <= 1 ? 1 : n <= 4 ? 4 : n <= 8 ? 8 : n <= 12 ? 12 : 16;
    lastCatN = N;
    for (let i = 0; i < catSvgs.length; i++) catSvgs[i].style.display = 'none';
    for (let i = 0; i < N; i++) {
      const tt = N === 1 ? t : t - ((shutter / FPS) * i) / (N - 1);
      const s = catSvg(i), g = cat.render(tt);
      s.innerHTML = g;
      s.style.display = g ? 'block' : 'none';
      // samples are added (plus-lighter) at 1/N each inside an isolated group: an exact average
      s.style.mixBlendMode = N === 1 ? 'normal' : 'plus-lighter';
      s.style.opacity = N === 1 ? '1' : String(1 / N);
    }
  }

  // ---- credit slot
  function creditAt(f) {
    if (f < M0 + MD + 6) return CR.marsMoons;      // until the Mars photo has faded into the line circle
    if (f < DX0) return CR.nasa;
    if (f < goA + 8) return CR.ll2;
    if (f < IR0 + 8) return CR.hirise;
    if (f < MA0 + 4) return CR.jaxa;
    if (f < F.or2 + 6) return CR.viking;
    if (f < IRIS2 + 10) return CR.marsMoons;
    if (f < F.liftoff) return CR.hirise;
    return CR.ll2;
  }

  // ================================================================ frame
  let lastN = 1;
  const CHIP_A = F.mars4 + 4, CHIP_B = IRIS2 + 8;
  const MARK_A = F.show + 3;           // wordmark dot; the echo ring lands 12 frames later, with the sonic logo's echo
  function renderAt(t) {
    const f = Math.min(LAST, Math.max(0, Math.round(t * FPS)));
    lastN = renderPicture(f);
    const next = f >= F.liftoff;

    giant('g6', f, F.six, F.in - 3);
    gdata('g6d', f, F.six + 5, F.in - 3);
    giant('g50', f, F.fifty, DX0);
    gdata('g50d', f, F.million, DX0);
    giant('gMon', f, F.monday1, goA, 1, 12);
    gdata('gMond', f, F.monday1 + 6, goA, 1, 12);
    giant('gMmx', f, F.mmx, F.fly - 2);
    if (f >= F.fifty && f < DX0 + 8) {
      let peak = 0; for (let q = F.fifty; q <= f; q++) peak = Math.max(peak, spring((q - F.fifty + 1) / FPS, 0.8, 2));
      $('g50').textContent = String(Math.max(1, Math.min(50, Math.floor(50 * peak + 1e-6))));
    }

    const lp = lensState(f, 'P'), ld = lensState(f, 'D');
    const labOn = (st) => st.grow >= 1 && f < IRIS2;
    const lP = $('labP'), lD = $('labD');
    show(lP, labOn(lp) && f >= F.moons1 + 8); show(lD, labOn(ld) && f >= F.moons1 + 11);
    lP.style.left = (LENS.P.x - LENS.P.r) + 'px'; lP.style.top = (lp.y + lp.r + 14).toFixed(1) + 'px';
    lD.style.left = (LENS.D.x - LENS.D.r) + 'px'; lD.style.top = (ld.y + ld.r + 14).toFixed(1) + 'px';

    $('kText').textContent = next ? 'Next on Launch day' : 'Launch day';

    show($('chip'), f >= CHIP_A && f < CHIP_B, 'flex');
    if (f >= CHIP_A && f < CHIP_B) ringEl($('chipRing'), f - (CHIP_A + 24));

    $('next').style.display = next ? 'block' : 'none';
    if (next) {
      show($('nHead'), f >= F.liftoff + 2);
      show($('nDate'), f >= F.monday2);
      show($('nData'), f >= F.h3);
      show($('nPoint'), f >= F.liftoff + 33);
      show($('nMark'), f >= MARK_A, 'flex');
      const de = sp(f - MARK_A, 0.7, 4);
      $('nDot').style.transform = `scale(${(0.4 + 0.6 * de).toFixed(4)})`;
      ringEl($('nRing'), f - (MARK_A + 12));
      $('nWord').style.visibility = f >= MARK_A + 4 ? 'visible' : 'hidden';
    }

    const cr = creditAt(f), ce = $('credit');
    ce.textContent = cr; show(ce, !!cr);

    renderCaptions(f);
    renderCat(f);
  }

  // ================================================================ checks: rectangles the cat must avoid, and the lint
  function textRects(f) {
    // giant type and NEXT card text on screen at frame f (rendered boxes), plus caption line boxes and photo subjects
    const out = [];
    const c = chunkAt(f); if (c) c.rects.forEach((r, i) => out.push({ r, what: 'caption line ' + (i + 1) }));
    for (const s of SUBJ) if (f >= s.a && f < s.b) out.push({ r: s.r, what: s.what });
    return out;
  }
  function catLint() {
    const rows = [];
    let onFrames = 0;
    for (const sg of CATSEG) {
      // group frames by the set of rectangles active, then lint each run with Actor.lint
      let runA = sg.a, key = null, rects = null;
      const flush = (b) => {
        if (rects == null) return;
        const hits = cat.lint(runA / FPS, (b - 1) / FPS, rects.map((x) => x.r), { tol: 10 });
        for (const h of hits) {
          const t = h.frame / FPS, bx = cat.box(t), e = cat._rootEntry(t);
          // not a real hit: fully outside the frame (before an entrance or after an exit), or the part
          // the lint box covers is hidden behind the caption box (the pop entrance clips him behind it)
          if (bx[0] > 1080 || bx[0] + bx[2] < 0 || bx[1] > 1920 || bx[1] + bx[3] < 0) continue;
          if (e && e.m.clip && t - e.t0 <= e.dur && e.m.clip(t - e.t0) && typeof h.rect === 'number' && rects[h.rect].r[1] >= FLOOR[1]) continue;
          rows.push({ seg: sg.id, ...h, what: typeof h.rect === 'number' ? rects[h.rect].what : 'safe zone' });
        }
      };
      for (let f = sg.a; f <= sg.b; f++) {
        const rs = textRects(f), kk = rs.map((x) => x.what + x.r.join(',')).join('|');
        if (kk !== key) { flush(f); runA = f; key = kk; rects = rs; }
      }
      flush(sg.b + 1);
    }
    for (let f = 0; f <= LAST; f++) if (cat.render(f / FPS)) { const b = cat.box(f / FPS); if (b[0] < 1080 && b[0] + b[2] > 0 && b[1] < 1920 && b[1] + b[3] > 0) onFrames++; }
    return { segments: CATSEG, framesOnScreen: onFrames, totalFrames: NF, share: +(onFrames / NF).toFixed(3), hits: rows };
  }

  // ================================================================ cue list for the sound mixer (curated: 12 to 18 cues)
  function cues() {
    const L = [];
    const c = (frame, type, note, extra = {}) => L.push({ frame: Math.round(frame), fps: FPS, type, ...extra, note });
    c(Math.round(0.3 * FPS), 'cat_in', 'cat pops up from behind the caption');
    c(M0, 'hard_cut', 'Phobos shrinks into the orbit dot, Mars into the line circle', { sfx: 'whoosh_short' });
    c(F.six, 'number_slam', '6 FT');
    c(F.fifty, 'number_slam', '50 (count-up)', { gain_db: -2 });
    c(Math.max(F.mars3, F.crashes + 10), 'impact', 'the dot hits Mars (line art)');
    c(F.shatters, 'glitch', 'the dot breaks into a ring of fragments', { gain_db: 2 });
    c(F.monday1, 'number_slam', 'MON', { gain_db: -2 });
    c(F.mmx, 'number_slam', 'MMX', { gain_db: -2 });
    c(F.phobos2 + 2, 'impact', 'MMX touches down (line art)', { gain_db: -3 });
    c(F.fly, 'scene_move', 'capsule flies home, the camera follows to Mars');
    c(CHIP_A, 'chip_in', 'SIGNAL DELAY MARS 12 min 43 s');
    c(CHIP_A + 24, 'echo_land', 'chip echo ring lands');
    c(Math.round((W[I.moons1].start + 0.6) * FPS), 'cat_chirp', 'cat floats in for "Why bother?"', { gain_db: -2 });
    c(IRIS2 - 2, 'reveal', 'the Phobos lens opens into the close-up', { gain_db: -3 });
    c(F.liftoff, 'next_card_in', 'hard cut on "Liftoff" to the NEXT card');
    c(MARK_A, 'wordmark_echo', 'wordmark dot (sonic logo; its echo lands with the ring 12 frames later)');
    return L.sort((a, b) => a.frame - b.frame);
  }

  window.renderAt = renderAt;
  window.SD = {
    F, I, NF, NV, LAST, FPS, W, get CHUNKS() { return CHUNKS; }, cues, catLint, get cat() { return cat; },
    lastSamples: () => [lastN, lastCatN], captionsAt: renderCaptions,
    rects: () => ({ g6: $('g6').getBoundingClientRect().toJSON(), subj: SUBJ }),
  };
  window.__ready = (async () => {
    await Promise.all([document.fonts.load("800 100px 'Archivo'"), document.fonts.load("700 90px 'Archivo'"), document.fonts.load("500 28px 'IBM Plex Mono'")]);
    await document.fonts.ready;
    await Promise.all(imgPromises);
    buildChunks();
    buildCat();
    window.CUES = cues();
  })();

  const params = new URLSearchParams(location.search);
  window.__ready.then(() => {
    if (params.has('t')) renderAt(Number(params.get('t')) || 0);
    else {
      let t0 = null;
      const loop = (ts) => { if (t0 === null) t0 = ts; renderAt(((ts - t0) / 1000) % (NF / FPS)); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
  });
})();
</script>
