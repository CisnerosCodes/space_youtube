// ===== core.js =====
// core.js: math, seeded noise, line boil, cel shapes, anime effects. Everything is a pure function of t.
'use strict';
const W = 1080, H = 1920, FPS = 30;
const C = {
  ink: '#0b0b0c', ink2: '#15161f', night: '#0e1230', night2: '#1b2152', night3: '#2c2f6b',
  paper: '#f2efe8', paper2: '#d9d3c6', paper3: '#b9b2a3',
  amber: '#f5b83d', amber2: '#c9861f', amber3: '#ffd77a',
  fur: '#232536', fur2: '#13141d', fur3: '#3a3e5c', furLine: '#4d5276',
  red: '#e2402f', red2: '#9c1f1c', mars: '#c9562f', mars2: '#8a2f1c', mars3: '#ec8a52',
  pho: '#9d8574', pho2: '#6b5648', pho3: '#cbb59f', pho4: '#4a3a31',
  sky: '#cfe3f0', cyan: '#7fd6ff', blue: '#2b5fd9', blue2: '#163a8f', green: '#6fa35a', green2: '#4b7a3e',
  smoke: '#e9e4da', smoke2: '#b7b0a6', smoke3: '#7d7872', fire: '#ffb347', fire2: '#ff6a2a', fire3: '#fff3c4',
};

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const smooth = (x) => x * x * (3 - 2 * x);
const ss = (a, b, x) => smooth(inv(a, b, x));
const E = {
  out: (x) => 1 - Math.pow(1 - clamp(x), 3),
  out5: (x) => 1 - Math.pow(1 - clamp(x), 5),
  in: (x) => Math.pow(clamp(x), 3),
  io: (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; },
  back: (x, s = 1.9) => { x = clamp(x) - 1; return 1 + x * x * ((s + 1) * x + s); },
};
// damped spring 0 -> 1, t in seconds
function spring(t, zeta = 0.45, f = 3.2) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta * w / wd) * Math.sin(wd * t));
}
// decaying wobble used by hits
const bump = (t, f = 9, d = 7) => (t < 0 ? 0 : Math.exp(-d * t) * Math.sin(2 * Math.PI * f * t));

// ---------- seeded noise ----------
function hash(a, b = 0, c = 0) {
  let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function mulberry(seed) {
  let s = seed >>> 0;
  return () => { s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
// 1D value noise, smooth
function vnoise(x, seed = 0) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return lerp(hash(i, seed, 7), hash(i + 1, seed, 7), u) * 2 - 1;
}

// ---------- frame state ----------
const G = { t: 0, f: 0, BF: 0, tc: 0, boilPx: 1.6, S: 1 };
function setFrame(t) {
  G.t = t; G.f = Math.round(t * FPS);
  G.BF = Math.floor(G.f / 3);            // line boil: new drawing every 3 frames (10 fps)
  G.tc = Math.floor(G.f / 2) * 2 / FPS;  // character time on twos (15 fps)
}

// ---------- canvas helpers ----------
let ctx = null;
function useCtx(c) { ctx = c; }
// current uniform scale of the transform (px per unit), for constant-pixel boil
function curScale() { const m = ctx.getTransform(); return Math.sqrt(Math.abs(m.a * m.d - m.b * m.c)) || 1; }

// jitter: seed per shape, i per point, changes every boil frame
function jit(seed, i, amp) {
  return [(hash(seed, i * 2, G.BF) - 0.5) * 2 * amp, (hash(seed, i * 2 + 1, G.BF) - 0.5) * 2 * amp];
}
function boilPts(pts, seed, px = G.boilPx) {
  const amp = px / curScale();
  return pts.map((p, i) => { const j = jit(seed, i, amp); return [p[0] + j[0], p[1] + j[1]]; });
}
// Catmull-Rom spline through points as bezier (closed or open)
function splinePath(pts, closed = true, tension = 1) {
  const n = pts.length; if (n < 2) return;
  ctx.moveTo(pts[0][0], pts[0][1]);
  const get = (i) => (closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)]);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2);
    const k = tension / 6;
    ctx.bezierCurveTo(p1[0] + (p2[0] - p0[0]) * k, p1[1] + (p2[1] - p0[1]) * k, p2[0] - (p3[0] - p1[0]) * k, p2[1] - (p3[1] - p1[1]) * k, p2[0], p2[1]);
  }
  if (closed) ctx.closePath();
}
function polyPath(pts, closed = true) {
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  if (closed) ctx.closePath();
}
// boiled smooth shape
function shapePath(pts, seed, { smooth: sm = true, closed = true, px } = {}) {
  const b = boilPts(pts, seed, px);
  ctx.beginPath();
  if (sm) splinePath(b, closed); else polyPath(b, closed);
}
// ellipse as points (for boil)
function ellPts(cx, cy, rx, ry, n = 16, rot = 0) {
  const out = [];
  for (let i = 0; i < n; i++) { const a = (i / n) * Math.PI * 2; const x = Math.cos(a) * rx, y = Math.sin(a) * ry; out.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]); }
  return out;
}
// cel fill: base fill, clipped shadow drawn by fn, outline
function cel(pathFn, { fill, shade, shadeFn, hi, hiFn, line = C.ink, lw = 0, keyline, keyW = 0 }) {
  if (keyline && keyW) { pathFn(); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = keyline; ctx.lineWidth = keyW; ctx.stroke(); }
  pathFn(); if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if ((shade && shadeFn) || (hi && hiFn)) {
    ctx.save(); pathFn(); ctx.clip();
    if (shade && shadeFn) { ctx.fillStyle = shade; ctx.beginPath(); shadeFn(); ctx.fill(); }
    if (hi && hiFn) { ctx.fillStyle = hi; ctx.beginPath(); hiFn(); ctx.fill(); }
    ctx.restore();
  }
  if (lw) { pathFn(); ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = line; ctx.lineWidth = lw; ctx.stroke(); }
}
// boiled stroke line through points
function inkLine(pts, seed, { color = C.ink, lw = 4, smooth: sm = true, cap = 'round', px } = {}) {
  const b = boilPts(pts, seed, px);
  ctx.beginPath(); if (sm) splinePath(b, false); else polyPath(b, false);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = cap; ctx.lineJoin = 'round'; ctx.stroke();
}
// tapered brush stroke (thick in middle, thin at ends)
function brush(pts, seed, { color = C.ink, w0 = 1, w1 = 8, px } = {}) {
  const b = boilPts(pts, seed, px);
  const n = b.length; if (n < 2) return;
  const L = [], R = [];
  for (let i = 0; i < n; i++) {
    const p = b[i], q = b[Math.min(n - 1, i + 1)], o = b[Math.max(0, i - 1)];
    let dx = q[0] - o[0], dy = q[1] - o[1]; const d = Math.hypot(dx, dy) || 1; dx /= d; dy /= d;
    const s = i / (n - 1), w = lerp(w0, w1, Math.sin(Math.PI * s));
    L.push([p[0] - dy * w / 2, p[1] + dx * w / 2]); R.push([p[0] + dy * w / 2, p[1] - dx * w / 2]);
  }
  ctx.beginPath(); splinePath(L.concat(R.reverse()), true); ctx.fillStyle = color; ctx.fill();
}

// ---------- images ----------
const IMG = {};
function loadImg(key, src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => { IMG[key] = im; res(); }; im.onerror = () => rej(new Error('img ' + src)); im.src = src; });
}
// draw image centred at (cx, cy) with width w, rotation r (deg)
function drawImg(key, cx, cy, w, rot = 0, alpha = 1) {
  const im = IMG[key]; if (!im) return; const h = w * im.height / im.width;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(cx, cy); ctx.rotate(rot * Math.PI / 180); ctx.drawImage(im, -w / 2, -h / 2, w, h); ctx.restore();
}

// ---------- backgrounds and effects ----------
function fillBg(c) { ctx.fillStyle = c; ctx.fillRect(-200, -200, W + 400, H + 400); }
function vGrad(stops, y0 = 0, y1 = H) {
  const g = ctx.createLinearGradient(0, y0, 0, y1); stops.forEach(([k, c]) => g.addColorStop(k, c)); ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400);
}
function radGlow(x, y, r, c0, c1 = 'rgba(0,0,0,0)') {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, c0); g.addColorStop(1, c1); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
}
// 集中線: focus lines converging on (cx, cy). inner radius r0 (lines stop there), count n
function focusLines(cx, cy, r0, { n = 90, color = C.paper, alpha = 0.9, seed = 1, wMax = 22, rate = 2, jitterR = 0.35, reach = 1500 } = {}) {
  const bf = Math.floor(G.f / rate);
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + (hash(i, seed, bf) - 0.5) * (Math.PI * 2 / n) * 1.4;
    if (hash(i, seed + 3, bf) < 0.18) continue;
    const r1 = r0 * (1 + hash(i, seed + 1, bf) * jitterR * 2);
    const w = wMax * (0.25 + 0.75 * hash(i, seed + 2, bf));
    const ca = Math.cos(a), sa = Math.sin(a);
    ctx.beginPath();
    ctx.moveTo(cx + ca * r1, cy + sa * r1);
    ctx.lineTo(cx + ca * reach - sa * w, cy + sa * reach + ca * w);
    ctx.lineTo(cx + ca * reach + sa * w, cy + sa * reach - ca * w);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
// parallel speed lines moving along angle ang (deg), filling the frame
function speedLines(ang, { n = 40, color = C.paper, alpha = 0.7, seed = 5, speed = 3000, len = [200, 900], w = [2, 10], rate = 1, area = [0, 0, W, H] } = {}) {
  const a = ang * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const diag = Math.hypot(area[2], area[3]);
  ctx.save(); ctx.globalAlpha *= alpha; ctx.fillStyle = color;
  const cx = area[0] + area[2] / 2, cy = area[1] + area[3] / 2;
  for (let i = 0; i < n; i++) {
    const off = (hash(i, seed, 1) - 0.5) * diag;              // lateral position
    const L = lerp(len[0], len[1], hash(i, seed, 2));
    const ww = lerp(w[0], w[1], hash(i, seed, 3));
    const ph = hash(i, seed, 4) * (diag + L);
    const s = ((G.t * speed / rate + ph) % (diag + L)) - (diag + L) / 2; // along position
    const x0 = cx - sa * off + ca * s, y0 = cy + ca * off + sa * s;
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x0 - ca * L - sa * ww / 2, y0 - sa * L + ca * ww / 2);
    ctx.lineTo(x0 - ca * L + sa * ww / 2, y0 - sa * L - ca * ww / 2);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
// camera shake offset (px) from a list of hit times, decaying
function shakeAt(t, hits, amp = 26, dur = 0.5) {
  let x = 0, y = 0, r = 0;
  for (const [th, a = 1] of hits) {
    const d = t - th; if (d < 0 || d > dur) continue;
    const k = Math.exp(-d * 7) * a * amp, q = Math.floor(d * 30);
    x += (hash(q, 11, th * 100 | 0) - 0.5) * 2 * k; y += (hash(q, 12, th * 100 | 0) - 0.5) * 2 * k; r += (hash(q, 13, th * 100 | 0) - 0.5) * 0.02 * k / amp;
  }
  return [x, y, r];
}
// stars as tiny 4-point glints and dots, seeded, drifting
function stars(seed, n, { area = [0, 0, W, H], drift = [0, 0], color = C.paper, alpha = 0.8, size = 3 } = {}) {
  ctx.save(); ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    let x = area[0] + hash(i, seed, 1) * area[2] + drift[0] * (0.4 + hash(i, seed, 5));
    let y = area[1] + hash(i, seed, 2) * area[3] + drift[1] * (0.4 + hash(i, seed, 5));
    x = ((x - area[0]) % area[2] + area[2]) % area[2] + area[0];
    y = ((y - area[1]) % area[3] + area[3]) % area[3] + area[1];
    const s = size * (0.4 + hash(i, seed, 3) * 1.2);
    const tw = 0.55 + 0.45 * Math.sin(G.t * (2 + hash(i, seed, 4) * 4) + i);
    ctx.globalAlpha = alpha * tw;
    if (hash(i, seed, 6) > 0.85) { // glint
      ctx.beginPath(); ctx.moveTo(x, y - s * 3); ctx.lineTo(x + s * 0.6, y); ctx.lineTo(x, y + s * 3); ctx.lineTo(x - s * 0.6, y); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - s * 3, y); ctx.lineTo(x, y + s * 0.6); ctx.lineTo(x + s * 3, y); ctx.lineTo(x, y - s * 0.6); ctx.closePath(); ctx.fill();
    } else { ctx.beginPath(); ctx.arc(x, y, s * 0.5, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.restore();
}
// anime sparkle (kira) at x,y size s
function kira(x, y, s, color = C.paper, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = color; ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, r = i % 2 ? s * 0.18 : s; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

// ===== chars.js =====
// chars.js: Night Shift (anime design: echo-mark eyes, headset, oversized jacket) and Pho (grumpy Phobos).
'use strict';

const NS_DEF = {
  turn: 0, tilt: 0, look: [0, 0], lidL: 0, lidR: 0, slant: 0, low: 0, brow: 0, eyeK: 1, pupil: 1,
  mouth: 'w', open: 0, earL: 0, earR: 0, sweat: 0, light: 1, rim: C.amber, rimK: 1, glint: 0, keyW: 0.06,
  squash: 1, blink: 0, fang: 1, shock: 0, tuftUp: 0,
};
// head outline (right half, top -> chin), mirrored for the left
const HEAD_R = [[0, -0.93], [0.42, -0.88], [0.76, -0.64], [0.94, -0.28], [1.14, 0.02], [0.99, 0.12], [1.12, 0.31], [0.9, 0.4], [0.63, 0.63], [0.31, 0.79]];
function headPts(turn) {
  const R = HEAD_R.map(([x, y]) => [x * (1 - 0.1 * turn) + turn * 0.05, y]);
  const L = HEAD_R.slice(1).reverse().map(([x, y]) => [-x * (1 + 0.1 * turn) + turn * 0.05, y]);
  return [...R, [turn * 0.05, 0.83], ...L];
}
function nsHeadPath(p, seed) { return () => shapePath(headPts(p.turn), seed); }

// one ear: side -1 (viewer left) or 1, angle offset a (rad, + = outward droop)
function nsEar(p, side, a, seed) {
  const bx = side * 0.6 + p.turn * 0.05, by = -0.66;
  ctx.save(); ctx.translate(bx, by); ctx.rotate(side * a);
  const outer = [[side * -0.32, -0.16], [side * 0.36, 0.16], [side * 0.42, -0.86 - p.tuftUp * 0.05], [side * 0.24, -0.7]];
  const pts = [[side * -0.34, -0.12], [side * 0.05, -0.62], [side * 0.4, -0.86], [side * 0.36, -0.2], [side * 0.3, 0.14]];

    for (let i = 0; i < 4; i++) { const a = (-0.55 + i * 0.37) * sp; pts.push([0.22 + Math.cos(a) * 0.2, Math.sin(a) * 0.28 - 0.02], [0.3 + Math.cos(a) * 0.26, Math.sin(a) * 0.34 - 0.02]); }

// ----- Pho: the grumpy Phobos (drawn illustration, not the photo) -----
const PHO_DEF = { look: [0, 0], expr: 'grumpy', lid: 0.45, brow: 0, mouthK: 0, vein: 0, sweat: 0, squash: 1, shake: 0, light: 1, rim: C.amber, flinch: 0, piece: 0 };
function phoPts() {
  const pts = [];
  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * Math.PI * 2;
    const r = 1 + 0.07 * Math.sin(3 * a + 1.1) + 0.045 * Math.sin(5 * a + 2.3) + 0.03 * Math.sin(7 * a + 0.4) - (a > 0.2 && a < 1.1 ? 0.06 * Math.sin((a - 0.2) / 0.9 * Math.PI) : 0);
    pts.push([Math.cos(a) * r * 1.12, Math.sin(a) * r * 0.9]);
  }
  return pts;
}
const PHO_PTS = phoPts();
const PHO_CRATERS = [[0.62, 0.42, 0.3, 'big'], [-0.72, -0.36, 0.13], [-0.55, 0.5, 0.11], [0.15, -0.68, 0.1], [0.7, -0.3, 0.09], [-0.95, 0.12, 0.08], [0.35, 0.68, 0.07], [-0.2, 0.74, 0.08], [0.9, 0.05, 0.06], [-0.4, -0.66, 0.06]];
function drawPho(x, y, size, p0 = {}, rot = 0) {
  const p = Object.assign({}, PHO_DEF, p0);

  ctx.save(); ctx.translate(x + (p.shake ? (hash(G.f, 3, 1) - 0.5) * p.shake : 0), y); ctx.rotate(rot); ctx.scale(size, size * p.squash); G.S = size;
  const L = p.light;
  const body = () => shapePath(PHO_PTS, seed);
  cel(body, {
    fill: C.pho, keyline: C.ink, keyW: 0.05,
    shade: C.pho2, shadeFn: () => ctx.ellipse(-L * 1.25, 0.55, 1.35, 1.1, 0, 0, Math.PI * 2),
    hi: C.pho3, hiFn: () => ctx.ellipse(L * 0.65, -0.62, 0.55, 0.22, L * 0.45, 0, Math.PI * 2),
  });
  // rim light
  ctx.save(); body(); ctx.clip(); ctx.beginPath(); ctx.rect(L > 0 ? 0.1 : -3, -3, 2.9, 6); ctx.clip(); ctx.globalAlpha = 0.9; body(); ctx.strokeStyle = p.rim; ctx.lineWidth = 0.13; ctx.stroke(); ctx.restore();
  // grooves
  ctx.save(); body(); ctx.clip();
  for (let i = 0; i < 5; i++) inkLine([[-1.1, -0.2 + i * 0.13], [-0.3, -0.42 + i * 0.12], [0.6, -0.52 + i * 0.11]], seed + 40 + i, { color: C.pho2, lw: 0.018 });
  // craters
  PHO_CRATERS.forEach(([cx, cy, r, big], i) => {
    const pts = ellPts(cx, cy, r, r * 0.8, 10, 0.3);
    cel(() => shapePath(pts, seed + 60 + i), { fill: C.pho2, shade: C.pho4, shadeFn: () => ctx.ellipse(cx - r * 0.25, cy - r * 0.25, r * 0.9, r * 0.6, 0.3, 0, Math.PI * 2), line: C.pho4, lw: 0.02 });
    inkLine(ellPts(cx + r * 0.05, cy + r * 0.05, r * 1.02, r * 0.82, 10, 0.3).slice(1, 5), seed + 80 + i, { color: C.pho3, lw: big ? 0.04 : 0.022 });
  });
  ctx.restore();
  // the 'piece' outline: dashed amber cut line around a patch
  if (p.piece > 0) {
    ctx.save(); ctx.setLineDash([0.07, 0.05]); ctx.lineDashOffset = -G.t * 0.4;
    const pts = ellPts(-0.62, 0.12, 0.26, 0.2, 9, 0.4);
    shapePath(pts, seed + 99); ctx.strokeStyle = C.amber; ctx.lineWidth = 0.035 * p.piece; ctx.stroke(); ctx.restore();
  }
  // face
  const e = p.expr;
  const eyeY = -0.1, exL = -0.36, exR = 0.26;
  if (e === 'flinch') {
    inkLine([[exL - 0.14, eyeY - 0.08], [exL + 0.1, eyeY], [exL - 0.14, eyeY + 0.08]], seed + 10, { color: C.ink, lw: 0.06, smooth: false });
    inkLine([[exR + 0.14, eyeY - 0.08], [exR - 0.1, eyeY], [exR + 0.14, eyeY + 0.08]], seed + 11, { color: C.ink, lw: 0.06, smooth: false });
    inkLine([[-0.22, 0.32], [-0.12, 0.27], [-0.02, 0.33], [0.08, 0.27], [0.18, 0.32]], seed + 12, { color: C.ink, lw: 0.045, smooth: false });
  } else {
    const wide = e === 'alarm' ? 1 : 0;

      const rx = 0.15 + wide * 0.03, ry = 0.13 + wide * 0.05;
      ctx.save(); ctx.translate(ex, eyeY);
      ctx.fillStyle = '#fbf6ea'; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.clip();
      ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(p.look[0] * rx * 0.55, p.look[1] * ry * 0.5 + 0.02, wide ? 0.035 : 0.06, 0, Math.PI * 2); ctx.fill();
      // heavy grumpy lid, slanted down toward the centre
      const lid = wide ? 0 : p.lid;
      if (lid > 0) {
        ctx.fillStyle = C.pho2; ctx.rotate(sd * (e === 'furious' ? -0.45 : -0.22));

        ctx.strokeStyle = C.ink; ctx.lineWidth = 0.035; ctx.beginPath(); ctx.moveTo(-0.3, -ry + lid * ry * 2); ctx.lineTo(0.3, -ry + lid * ry * 2); ctx.stroke();
      }
      ctx.restore();
      ctx.strokeStyle = C.ink; ctx.lineWidth = 0.03; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      // brow
      const ba = e === 'furious' ? 0.55 : e === 'alarm' ? -0.25 : 0.32;
      const byy = eyeY - 0.24 - (wide ? 0.08 : 0) - p.brow * 0.06;
      ctx.save(); ctx.translate(ex, byy); ctx.rotate(sd * -ba);
      ctx.fillStyle = C.pho4; shapePath([[-0.2, -0.04], [0.2, -0.05], [0.21, 0.04], [-0.2, 0.05]], seed + 20 + (sd > 0 ? 1 : 0), { smooth: false, px: 0.6 }); ctx.fill();
      ctx.restore();
    }
    // mouth
    if (e === 'alarm') {
      ctx.fillStyle = C.pho4; ctx.beginPath(); ctx.ellipse(-0.04, 0.3, 0.07, 0.09 + p.mouthK * 0.05, 0, 0, Math.PI * 2); ctx.fill();
    } else if (e === 'furious') {
      const pts = [[-0.24, 0.3], [0.16, 0.28], [0.14, 0.4], [-0.22, 0.42]];
      ctx.fillStyle = C.pho4; shapePath(pts, seed + 30, { smooth: false }); ctx.fill();
      ctx.fillStyle = '#efe6d2'; ctx.fillRect(-0.2, 0.31, 0.33, 0.045); ctx.fillRect(-0.19, 0.365, 0.31, 0.04);
    } else {
      inkLine([[-0.26, 0.36], [-0.12, 0.28], [0.04, 0.27], [0.16, 0.34]], seed + 31, { color: C.pho4, lw: 0.055 });
    }
  }
  // anger vein mark (four curved ticks)
  if (p.vein > 0) {
    ctx.save(); ctx.translate(0.55, -0.55); ctx.scale(p.vein, p.vein); ctx.strokeStyle = C.red; ctx.lineWidth = 0.05; ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.moveTo(0.05, 0.16); ctx.quadraticCurveTo(0.07, 0.07, 0.16, 0.05); ctx.stroke(); }
    ctx.restore();
  }
  if (p.sweat > 0) {
    ctx.save(); ctx.translate(-0.78, -0.45); ctx.scale(p.sweat, p.sweat);
    ctx.fillStyle = C.cyan; ctx.strokeStyle = C.ink; ctx.lineWidth = 0.025;
    shapePath([[0, -0.16], [0.07, 0.02], [0.05, 0.08], [-0.05, 0.08], [-0.07, 0.02]], seed + 97, { px: 0.6 }); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
}

// ===== props.js =====
// props.js: stylized illustrations drawn in code (never photoreal): H3, MMX, IDEFIX, capsule, Electron,
// satellites, Earth with Australia, cel Mars, exhaust clouds, flames, Phobos ground.
'use strict';

// ---------- exhaust / smoke clouds ----------
// puffs: [{x, y, r}] in current units; light: direction of the flame light [dx, dy]; warm: 0..1 orange underlight
function cloudCluster(puffs, seed, { base = C.smoke, shade = C.smoke2, line = C.ink, lw = 6, warm = 0, warmC = C.fire2, lightDir = [0, 1], alpha = 1 } = {}) {
  if (!puffs.length) return;
  ctx.save(); ctx.globalAlpha *= alpha;
  const S = curScale();
  const circ = (p, i, k = 1) => { const pts = ellPts(p.x, p.y, p.r * k, p.r * k * 0.92, 12, i); shapePath(pts, seed + i * 7, { px: 2.2 }); };
  // union outline
  ctx.lineJoin = 'round';
  puffs.forEach((p, i) => { circ(p, i); ctx.strokeStyle = line; ctx.lineWidth = lw * 2 / S; ctx.stroke(); });
  puffs.forEach((p, i) => { circ(p, i); ctx.fillStyle = base; ctx.fill(); });
  // cel shadow (sky light from upper left -> shadow lower right) and a thin warm underlight crescent
  puffs.forEach((p, i) => {
    ctx.save(); circ(p, i); ctx.clip();
    ctx.fillStyle = shade; ctx.beginPath(); ctx.arc(p.x - p.r * 0.32, p.y - p.r * 0.3, p.r * 0.92, 0, Math.PI * 2); ctx.rect(p.x - p.r * 2, p.y - p.r * 2, p.r * 4, p.r * 4); ctx.fill('evenodd');
    if (warm > 0) { ctx.globalAlpha = warm; ctx.fillStyle = warmC; ctx.beginPath(); ctx.arc(p.x - lightDir[0] * p.r * 0.38, p.y - lightDir[1] * p.r * 0.38, p.r * 0.9, 0, Math.PI * 2); ctx.rect(p.x - p.r * 2, p.y - p.r * 2, p.r * 4, p.r * 4); ctx.fill('evenodd'); }
    ctx.restore();
  });
  ctx.restore();
}
// expanding launch billows: returns puffs for time since ignition d (s); side spread along the ground
function launchPuffs(d, seed, { cx = 0, gy = 0, spread = 900, up = 260, n = 26, rMax = 170 } = {}) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const b = hash(i, seed, 1) * 0.5;               // birth delay
    const k = clamp((d - b) / 1.6); if (k <= 0) continue;
    const side = i % 2 ? 1 : -1;
    const e = E.out(k);
    const reach = spread * (0.25 + 0.75 * hash(i, seed, 2));
    const x = cx + side * reach * e;
    const y = gy - up * hash(i, seed, 3) * e - 40 * Math.sin(k * 3);
    const r = rMax * (0.35 + 0.65 * hash(i, seed, 4)) * (0.3 + 0.7 * E.out(k * 1.4));
    out.push({ x, y, r });
  }
  // sort so back puffs (higher) draw first
  return out.sort((a, b) => a.y - b.y);
}
// flame plume pointing +y from (0,0), length len, width w; flicker on twos
function flame(len, w, seed, { core = C.fire3, mid = C.fire, outer = C.fire2, line = null } = {}) {
  const fk = (i) => 1 + (hash(i, seed, Math.floor(G.f / 2)) - 0.5) * 0.18;
  const plume = (k, ww) => {
    const pts = [[-ww * 0.5, 0], [-ww * 0.62 * fk(1), len * 0.18 * k], [-ww * 0.42 * fk(2), len * 0.55 * k], [0, len * k * fk(3)], [ww * 0.42 * fk(4), len * 0.55 * k], [ww * 0.62 * fk(5), len * 0.18 * k], [ww * 0.5, 0]];
    return pts;
  };
  shapePath(plume(1, w), seed, { px: 2 }); ctx.fillStyle = outer; ctx.fill(); if (line) { ctx.strokeStyle = line; ctx.lineWidth = 3 / curScale(); ctx.stroke(); }
  shapePath(plume(0.72, w * 0.72), seed + 1, { px: 2 }); ctx.fillStyle = mid; ctx.fill();
  shapePath(plume(0.42, w * 0.45), seed + 2, { px: 1.5 }); ctx.fillStyle = core; ctx.fill();
}

  ctx.fillStyle = '#a9622f'; shapePath([[-0.5, -2.4], [-0.18, -2.4], [-0.18, -5.6], [-0.5, -5.6]], seed + 22, { smooth: false }); ctx.fill();
  core(); ctx.strokeStyle = C.ink; ctx.lineWidth = lw; ctx.stroke();

  // front boosters

// ---------- MMX (stylized, simplified; not an engineering drawing). origin body centre; 1 unit = body width ----------
function drawMMX(x, y, s, { rot = 0, legs = 0, arm = 0, armAng = 0, corer = 0, burn = 0, seed = 3000, wing = 1, sampler = 0, dig = 0 } = {}) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); G.S = s;
  const lw = 4 / s;
  if (burn > 0) { ctx.save(); ctx.translate(0, 0.62); flame(2.6 * burn, 0.42, seed + 1); ctx.restore(); }
  // landing legs
  if (legs > 0) {
    for (const sx of [-1, -0.35, 0.35, 1]) {
      const far = Math.abs(sx) < 0.5;
      const foot = [sx * 0.75 * (1 + 0.25 * legs), 0.55 + 0.55 * legs];
      inkLine([[sx * 0.4, 0.3], foot], seed + 10 + sx * 10, { color: far ? '#6b6f80' : C.ink, lw: (far ? 0.07 : 0.1) });
      inkLine([[sx * 0.4, 0.3], foot], seed + 10 + sx * 10, { color: far ? '#9aa0b4' : '#d7dbe6', lw: (far ? 0.035 : 0.05) });
      ctx.fillStyle = far ? '#6b6f80' : '#d7dbe6'; ctx.strokeStyle = C.ink; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.ellipse(foot[0], foot[1], 0.12, 0.04, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // P-sampler box on the front-right leg
      if (sx === 1 && sampler > 0) {
        cel(() => { ctx.beginPath(); ctx.roundRect(foot[0] - 0.2, foot[1] - 0.3, 0.2, 0.2, 0.03); }, { fill: C.amber, shade: C.amber2, shadeFn: () => ctx.rect(foot[0] - 0.2, foot[1] - 0.2, 0.2, 0.1), line: C.ink, lw });
      }

  }

  if (wing > 0) for (const sd of [-1, 1]) {
    ctx.save(); ctx.scale(sd, 1);
    inkLine([[0.5, -0.05], [0.72, -0.05]], seed + 20, { lw: 0.06 });
    const pw = 1.7 * wing;
    cel(() => shapePath([[0.72, -0.32], [0.72 + pw, -0.4], [0.72 + pw, 0.24], [0.72, 0.2]], seed + 21 + sd, { smooth: false }), { fill: '#1f2f78', shade: '#16225a', shadeFn: () => ctx.rect(0.6, 0.0, 3, 0.4), hi: '#3d57b8', hiFn: () => ctx.rect(0.72 + pw * 0.15, -0.36, pw * 0.08, 0.6), line: C.ink, lw });
    ctx.strokeStyle = '#5d74d6'; ctx.lineWidth = 0.015;
    for (let i = 1; i < 6; i++) { const xx = 0.72 + pw * i / 6; ctx.beginPath(); ctx.moveTo(xx, -0.32 - 0.08 * i / 6); ctx.lineTo(xx, 0.2 + 0.04 * i / 6); ctx.stroke(); }
    ctx.beginPath(); ctx.moveTo(0.72, -0.06); ctx.lineTo(0.72 + pw, -0.08); ctx.stroke();
    ctx.restore();
  }
  // body: gold-foil box in 3/4
  const front = () => shapePath([[-0.5, -0.4], [0.5, -0.4], [0.5, 0.38], [-0.5, 0.38]], seed + 30, { smooth: false });
  const top = () => shapePath([[-0.5, -0.4], [-0.3, -0.62], [0.68, -0.62], [0.5, -0.4]], seed + 31, { smooth: false });
  const side = () => shapePath([[0.5, -0.4], [0.68, -0.62], [0.68, 0.16], [0.5, 0.38]], seed + 32, { smooth: false });
  cel(side, { fill: C.amber2, line: C.ink, lw });
  cel(top, { fill: C.amber3, line: C.ink, lw });
  cel(front, { fill: C.amber, shade: C.amber2, shadeFn: () => ctx.rect(-0.5, 0.1, 1, 0.3), line: C.ink, lw });

  inkLine([[0.1, -0.25], [0.25, -0.05], [0.15, 0.2]], seed + 34, { color: C.amber3, lw: 0.025 });
  // dish antenna on top

  cel(() => { ctx.beginPath(); ctx.ellipse(0, 0, 0.36, 0.13, 0, 0, Math.PI * 2); }, { fill: '#eef0f4', shade: '#b9c0cf', shadeFn: () => ctx.rect(-0.4, 0, 0.8, 0.2), line: C.ink, lw });
  inkLine([[0, 0], [0, -0.16]], seed + 35, { lw: 0.03 });

    ctx.fillStyle = C.amber; ctx.fillRect(-0.08, 0.02, 0.16, 0.05);

function orthoPt(lon, lat, lon0, lat0) {
  const d = Math.PI / 180; const la = lat * d, lo = (lon - lon0) * d, la0 = lat0 * d;

// ---------- Phobos ground (drawn): big curved horizon ----------
function drawPhoGround(cx, cy, R, { seed = 9000, light = 1, rim = C.amber } = {}) {
  // a huge disk whose top edge is the horizon
  const disk = () => shapePath(ellPts(cx, cy, R * 1.12, R * 0.9, 48), seed, { px: 2.5 });
  cel(disk, { fill: C.pho, keyline: C.ink, keyW: 6, shade: C.pho2, shadeFn: () => ctx.ellipse(cx - light * R * 0.9, cy + R * 0.5, R * 1.3, R * 1.1, 0, 0, Math.PI * 2) });
  ctx.save(); disk(); ctx.clip();
  ctx.save(); ctx.beginPath(); ctx.rect(light > 0 ? cx : cx - 3 * R, cy - 2 * R, 3 * R, 4 * R); ctx.clip(); disk(); ctx.strokeStyle = rim; ctx.lineWidth = 16; ctx.stroke(); ctx.restore();
  // craters in perspective (flattened ellipses), seeded
  const rnd = mulberry(seed);
  for (let i = 0; i < 26; i++) {
    const a = -Math.PI / 2 + (rnd() - 0.5) * 1.6, dd = 0.15 + rnd() * 0.85;
    const x = cx + Math.cos(a) * R * 1.12 * dd, y = cy - R * 0.9 + (1 - Math.cos((rnd() - 0.5) * 0.4)) * R + dd * R * 0.6 * rnd();
    const r = (8 + rnd() * 50) * (0.4 + (y - (cy - R * 0.9)) / (R * 0.6));
    if (y < cy - R * 0.88) continue;
    cel(() => shapePath(ellPts(x, y, r, r * 0.32, 10), seed + 30 + i, { px: 1.4 }), { fill: C.pho2, shade: C.pho4, shadeFn: () => ctx.ellipse(x - r * 0.2, y - r * 0.12, r * 0.9, r * 0.22, 0, 0, Math.PI * 2), line: C.pho4, lw: 2 });
    inkLine([[x - r * 0.8, y + r * 0.2], [x, y + r * 0.34], [x + r * 0.8, y + r * 0.2]], seed + 60 + i, { color: C.pho3, lw: Math.max(1.5, r * 0.06) });
  }
  // grooves
  for (let i = 0; i < 4; i++) inkLine([[cx - R * 0.9, cy - R * 0.72 + i * 40], [cx, cy - R * 0.66 + i * 46], [cx + R * 0.9, cy - R * 0.72 + i * 40]], seed + 90 + i, { color: C.pho2, lw: 3 });
  ctx.restore();
}

// chunk end: next chunk start, or last word end + 0.45 s if there is a pause
CHUNKS.forEach((c, i) => {
  const next = CHUNKS[i + 1];
  const endHold = WORDS[c.b].end + 0.45;
  c.f0 = wf(c.a);
  c.f1 = next ? Math.min(wf(next.a), Math.round(Math.max(endHold, WORDS[c.b].end) * FPS)) : Math.round(42 * FPS);
  if (next && wf(next.a) - Math.round(WORDS[c.b].end * FPS) < 18) c.f1 = wf(next.a);

const CUTS = [103, 147, 168, 212, 244, 314, 356, 446, 496, 544, 560, 600, 630, 687, 758, 792, 846, 913, 949, 999, 1038, 1064, 1162];

const CAP_OVR = {};

function capFont(size, em) {
  ctx.font = em ? `400 ${size}px "Dela Gothic One"` : `italic 900 ${size}px Archivo`;
  ctx.fontStretch = 'normal';
}
// layout a chunk -> [{i, x, y(baseline), size, em, w}]
function layoutChunk(c) {
  const o = Object.assign({}, c, CAP_OVR[CHUNKS.indexOf(c)] || {});
  const items = []; let x = o.x, lineTop = o.y, line = [];
  const maxX = SAFE.x1;
  const flush = () => {
    if (!line.length) return;
    const asc = Math.max(...line.map((w) => w.size * (w.em ? 0.92 : 0.8)));
    const desc = Math.max(...line.map((w) => w.size * (w.em ? 0.18 : 0.24)));
    line.forEach((w) => { w.y = lineTop + asc; items.push(w); });
    lineTop += asc + desc + 14; line = []; x = o.x;
  };
  for (let i = o.a; i <= o.b; i++) {
    const k = (o.em && o.em[i]) || 1; const em = k > 1.01;
    const size = o.size * k;
    capFont(size, em);
    const text = WORDS[i].text;
    const w = ctx.measureText(text).width;
    const gap = o.size * 0.26;
    if ((o.br && o.br.includes(i)) || (line.length && x + w > maxX)) flush();
    let sz = size, ww = w;
    if (x + ww > maxX) { sz = size * (maxX - x) / ww; ww = maxX - x; }  // shrink a single long word to fit
    line.push({ i, x, size: sz, em, w: ww, text });

  // keep the chunk inside the safe area and above the credit slot (y 1440)
  const bottom = Math.max(...items.map((w) => w.y + w.size * (w.em ? 0.2 : 0.26)));
  const lim = o.maxY || 1436;
  if (bottom > lim) { const d = bottom - lim; items.forEach((w) => { w.y -= d; }); }
  const top = Math.min(...items.map((w) => w.y - w.size * (w.em ? 0.95 : 0.85)));
  if (top < SAFE.y0) { const d = SAFE.y0 - top; items.forEach((w) => { w.y += d; }); }
  // ink-exact fit (final check): every line's real ink (outline stroke, drop, italic overhang and tilt
  // included) sits inside CAP_SAFE at rest; a line that is too wide is scaled down, then shifted in.
  const tilt = o.tilt != null ? o.tilt : -3;
  const lines = [];
