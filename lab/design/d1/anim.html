<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Telemetry motion test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
:root{--ink:#0B0B0C;--paper:#F2EFE8;--amber:#F5B83D;--muted:#8C8A85;--bar:rgba(11,11,12,.82)}
html,body{margin:0;background:var(--ink)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--ink);font-family:'Archivo',sans-serif;color:var(--paper)}
.layer{position:absolute;inset:0}
.shot{position:absolute;inset:0;overflow:hidden;opacity:0}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%}
.mono{font-family:'IBM Plex Mono',monospace;font-weight:500}
.hl{font-weight:800;font-stretch:118%;font-size:150px;letter-spacing:-0.02em;line-height:.92;text-transform:uppercase;margin:0}
#prog{position:absolute;left:0;top:0;width:1080px;height:6px;display:flex;gap:4px}
#prog .seg{flex:1;position:relative;background:rgba(242,239,232,.22);overflow:hidden}
#prog .fill{position:absolute;inset:0;background:var(--amber);transform-origin:0 50%;transform:scaleX(0)}
#kicker{font-family:'IBM Plex Mono',monospace;font-weight:500;position:absolute;left:80px;top:268px;background:var(--bar);padding:8px 14px;font-size:30px;line-height:40px;letter-spacing:.12em;color:var(--amber);text-transform:uppercase;white-space:pre}
#chip{font-family:'IBM Plex Mono',monospace;font-weight:500;position:absolute;left:80px;top:340px;border:2px solid var(--amber);background:var(--bar);padding:8px 16px 8px 14px;display:flex;align-items:center;gap:14px;font-size:28px;line-height:38px;white-space:pre;color:var(--paper)}
#chip .dots{position:relative;width:26px;height:12px}
#chip .dot{position:absolute;left:0;top:0;width:12px;height:12px;border-radius:50%;background:var(--amber)}
#chip .echo{position:absolute;left:14px;top:0;width:12px;height:12px;border-radius:50%;box-sizing:border-box;border:2px solid var(--amber)}
#chip b{font-weight:500;color:var(--amber)}
#caps{position:absolute;left:80px;top:1160px;width:820px}
.cline{position:absolute;left:0;display:none;background:var(--bar);padding:10px 18px;font-weight:700;font-stretch:100%;font-size:88px;line-height:88px;letter-spacing:-0.01em;white-space:nowrap}
.cline span{display:none}
#lt{font-family:'IBM Plex Mono',monospace;font-weight:500;position:absolute;left:80px;top:1416px;width:520px;box-sizing:border-box;border-top:2px solid var(--amber);background:var(--bar);padding:6px 14px 8px;font-size:26px;line-height:34px;letter-spacing:.04em;text-transform:uppercase;color:var(--paper)}
#scrim{position:absolute;inset:0;background:rgba(11,11,12,.60)}
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="shots"></div>
  <div id="scrim"></div>

  <!-- diagram (flat line art, beats 6 and 7) -->
  <svg id="diagram" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920" aria-hidden="true" style="opacity:0">
    <g id="dgroup" style="transform-origin:540px 950px">
      <circle cx="840" cy="860" r="64" fill="none" stroke="#F2EFE8" stroke-width="2"></circle>
      <circle cx="220" cy="1040" r="92" fill="none" stroke="#F2EFE8" stroke-width="2"></circle>
      <line x1="80" y1="1140" x2="1000" y2="1140" stroke="#8C8A85" stroke-width="1" stroke-dasharray="2 10"></line>
      <path id="traj" d="M 840 792 C 960 792 968 934 840 934 C 660 934 470 1000 314 1040" fill="none" stroke="#F5B83D" stroke-width="4" stroke-linecap="round"></path>
      <rect id="burnmark" x="832" y="926" width="16" height="16" fill="#F5B83D"></rect>
      <circle id="earthdot" cx="314" cy="1040" r="10" fill="#F5B83D" style="opacity:0"></circle>
      <text x="800" y="770" fill="#8C8A85" font-family="IBM Plex Mono" font-weight="500" font-size="24" letter-spacing="2.4">MOON</text>
      <text x="120" y="922" fill="#8C8A85" font-family="IBM Plex Mono" font-weight="500" font-size="24" letter-spacing="2.4">EARTH</text>
    </g>
  </svg>

  <!-- data block (beats 6 and 7) -->
  <div id="data" style="position:absolute;left:80px;top:420px;opacity:0">
    <div id="dlabel" class="mono" style="font-size:26px;line-height:34px;letter-spacing:.12em;color:#8C8A85;text-transform:uppercase">Return powered flyby burn</div>
    <div id="dnum" style="font-weight:800;font-stretch:118%;font-size:300px;line-height:276px;letter-spacing:-0.02em;color:#F5B83D;margin-top:14px;font-variant-numeric:tabular-nums">0:00</div>
    <div id="dunit" class="mono" style="font-size:26px;line-height:34px;letter-spacing:.12em;color:#8C8A85;margin-top:6px">MIN : SEC</div>
    <div id="dsplash" class="hl" style="display:none;margin-top:14px;color:#F2EFE8">Pacific<br>Ocean</div>
  </div>

  <!-- hook title -->
  <div id="hook" style="position:absolute;left:80px;top:360px">
    <h1 class="hl" style="color:#F2EFE8">1:47 A.M.</h1>
    <div id="hookread" class="mono" style="margin-top:30px;font-size:30px;line-height:40px;letter-spacing:.12em;color:#F2EFE8;visibility:hidden">ARTEMIS I · EST · WED 16 NOV 2022</div>
  </div>

  <!-- end card -->
  <div id="end" style="position:absolute;inset:0;background:#0B0B0C;display:none">
    <div style="position:absolute;left:80px;top:360px">
      <div class="hl" style="font-stretch:125%;color:#F2EFE8">Signal</div>
      <div id="endDelay" class="hl" style="font-stretch:125%;color:#F5B83D">Delay</div>
      <svg width="120" height="48" viewBox="0 0 120 48" aria-hidden="true" style="display:block;margin-top:56px">
        <circle cx="24" cy="24" r="22" fill="#F5B83D"></circle>
        <circle id="endEcho" cx="80" cy="24" r="21" fill="none" stroke="#F5B83D" stroke-width="4"></circle>
      </svg>
      <div class="mono" style="margin-top:40px;font-size:30px;line-height:44px;letter-spacing:.12em;color:#F2EFE8">ONE REAL SPACE STORY A DAY<br><span style="color:#8C8A85">SOURCE ON SCREEN</span></div>
    </div>
  </div>

  <div id="kicker" class="mono">01 / LAUNCHING TODAY</div>
  <div id="chip" style="opacity:0"><span class="dots"><span class="dot"></span><span class="echo" id="chipEcho"></span></span><span>SIGNAL DELAY  <b>MOON 1.3 s</b></span></div>
  <div id="caps"><div class="cline" id="cl0" style="top:0"></div><div class="cline" id="cl1" style="top:116px"></div></div>
  <div id="lt"><div id="ltCredit"></div><div id="ltDate"></div></div>
  <div id="prog"></div>
</div>

<script>
(function(){
  const FPS = 30;
  // ---------- easing ----------
  function bezier(x1,y1,x2,y2){
    const cx=3*x1, bx=3*(x2-x1)-cx, ax=1-cx-bx, cy=3*y1, by=3*(y2-y1)-cy, ay=1-cy-by;
    const sx=t=>((ax*t+bx)*t+cx)*t, sy=t=>((ay*t+by)*t+cy)*t, dx=t=>(3*ax*t+2*bx)*t+cx;
    return x=>{ if(x<=0) return 0; if(x>=1) return 1; let t=x;
      for(let i=0;i<8;i++){ const e=sx(t)-x, d=dx(t); if(Math.abs(e)<1e-6||Math.abs(d)<1e-6) break; t-=e/d; }
      let lo=0,hi=1; for(let i=0;i<30&&Math.abs(sx(t)-x)>1e-6;i++){ if(sx(t)<x) lo=t; else hi=t; t=(lo+hi)/2; }
      return sy(t); };
  }
  const enter = bezier(0.16,1,0.3,1), move = bezier(0.76,0,0.24,1), exitE = bezier(0.7,0,0.84,0);
  function spring(t,zeta,f){ if(t<=0) return 0; const w=2*Math.PI*f, wd=w*Math.sqrt(1-zeta*zeta);
    return 1-Math.exp(-zeta*w*t)*(Math.cos(wd*t)+(zeta*w/wd)*Math.sin(wd*t)); }
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

  // ---------- shots ----------
  const SHOTS = [
    {id:'NHQ202211160003', s:0,   e:30,  pos:'50% 50%', credit:'NASA/Joel Kowsky', date:'PAD 39B · 16 NOV 2022', alt:'SLS rocket lifting off'},
    {id:'NHQ202211160030', s:30,  e:60,  pos:'46% 50%', credit:'NASA/Joel Kowsky', date:'PAD 39B · 16 NOV 2022', alt:'Liftoff beside the pad towers'},
    {id:'NHQ202211160022', s:60,  e:90,  pos:'50% 50%', credit:'NASA/Joel Kowsky', date:'PAD 39B · 16 NOV 2022', alt:'Engines and boosters igniting'},
    {id:'NHQ202211160019', s:90,  e:105, pos:'56% 50%', credit:'NASA/Joel Kowsky', date:'PAD 39B · 16 NOV 2022', alt:'Exhaust trail arcing across the night sky'},
    {id:'NHQ202211160200', s:105, e:150, pos:'58% 40%', credit:'NASA/Bill Ingalls', date:'PAD 39B · 16 NOV 2022', alt:'SLS and Orion clearing the lightning towers'},
    {id:'NHQ202211160012', s:150, e:180, pos:'50% 50%', credit:'NASA/Bill Ingalls', date:'PAD 39B · 16 NOV 2022', alt:'Night launch reflected in water'},
    {id:'art001e002083',   s:180, e:240, pos:'95% 50%', credit:'NASA', date:'FLIGHT DAY 20 · 05 DEC 2022', alt:'Earth rising behind the Moon, seen from Orion'}
  ];
  const shotsEl = document.getElementById('shots');
  const imgs = [];
  SHOTS.forEach(sh=>{
    const d=document.createElement('div'); d.className='shot';
    const im=document.createElement('img'); im.src='../../assets/nasa/'+sh.id+'.jpg'; im.alt=sh.alt; im.style.objectPosition=sh.pos;
    d.appendChild(im); shotsEl.appendChild(d); sh.el=d; sh.img=im; imgs.push(im);
  });

  // ---------- beats / progress ----------
  const BEATS=[0,30,60,105,180,240,315];
  const prog=document.getElementById('prog');
  const fills=BEATS.map(()=>{ const s=document.createElement('div'); s.className='seg'; const f=document.createElement('div'); f.className='fill'; s.appendChild(f); prog.appendChild(s); return f; });

  // punch-ins: frames where a new chunk lands
  const PUNCH=[15,135,210,285];
  function punch(f){ let s=1; for(const P of PUNCH){ const d=f-P; if(d>=0&&d<6){ const p=d/6;
      s = p<1/3 ? 1+0.06*enter(p*3) : 1+0.06*(1-move((p-1/3)*1.5)); } } return s; }

  // ---------- captions ----------
  const CARDS=[
    {s:30, e:60,  lines:[[['Launch',30],['Pad',38],['39B.',45]]]},
    {s:60, e:105, lines:[[['Artemis',60],['I',68],['lifts',75],['off.',83]]]},
    {s:105,e:150, lines:[[['SLS',105],['and',113],['Orion',120]],[['fly',135],['together',143]]]},
    {s:150,e:180, lines:[[['for',150],['the',158],['first',165],['time.',173]]]},
    {s:180,e:195, lines:[[['Day',180],['20.',188]]]},
    {s:195,e:240, lines:[[['Earth',195],['rises',203]],[['behind',210],['the',218],['Moon.',225]]]},
    {s:240,e:285, lines:[[['A',240],['3-minute,',248]],[['27-second',255],['burn',263]]]},
    {s:285,e:315, lines:[[['sends',285],['Orion',293],['home.',300]]]},
    {s:315,e:345, lines:[[['Splashdown:',315]],[['Dec.',323],['11.',330]]]}
  ];
  const cl=[document.getElementById('cl0'),document.getElementById('cl1')];
  let lastCard=-1;
  function renderCaps(f){
    const ci=CARDS.findIndex(c=>f>=c.s&&f<c.e);
    if(ci!==lastCard){
      cl.forEach(x=>{x.innerHTML='';});
      if(ci>=0) CARDS[ci].lines.forEach((ln,li)=>{ ln.forEach(([w,fr],wi)=>{ const sp=document.createElement('span'); sp.textContent=(wi?' ':'')+w; sp.dataset.f=fr; cl[li].appendChild(sp); }); });
      lastCard=ci;
    }
    if(ci<0){ cl.forEach(x=>x.style.display='none'); return; }
    // active word = latest revealed
    let act=-1; CARDS[ci].lines.flat().forEach(([w,fr])=>{ if(fr<=f) act=Math.max(act,fr); });
    cl.forEach(line=>{ let any=false; [...line.children].forEach(sp=>{ const fr=+sp.dataset.f; const on=fr<=f; sp.style.display=on?'inline':'none'; sp.style.color=(fr===act)?'#F5B83D':'#F2EFE8'; any=any||on; }); line.style.display=any?'block':'none'; });
  }

  const $=id=>document.getElementById(id);
  const traj=$('traj'); const TL=traj.getTotalLength(); traj.style.strokeDasharray=TL+' '+TL;

  function renderFrame(f){
    // shots
    let active=null;
    SHOTS.forEach(sh=>{ const on=f>=sh.s&&f<sh.e; sh.el.style.opacity=on?1:0; if(on){ active=sh;
      const push=1+0.03*(f-sh.s)/(sh.e-sh.s); sh.img.style.transform='scale('+(push*punch(f)).toFixed(5)+')'; } });
    $('scrim').style.opacity = f<30 ? 1 : 0;

    // progress
    BEATS.forEach((b,i)=>{ let v=0; if(f>=b){ v = i===0 ? 1 : enter(clamp((f-b)/6,0,1)); } fills[i].style.transform='scaleX('+v.toFixed(4)+')'; });

    // hook
    $('hook').style.display = f<30 ? 'block':'none';
    $('hookread').style.visibility = f>=15 ? 'visible':'hidden';

    // kicker
    $('kicker').textContent = f>=345 ? '@SIGNALDELAYHQ' : '01 / LAUNCHING TODAY';

    // chip: wipe in at 195, echo ring lands 1.3 s (39 frames) later
    const chip=$('chip');
    if(f>=195&&f<345){ chip.style.opacity=1; const p=enter(clamp((f-195)/8,0,1)); chip.style.clipPath='inset(0 '+((1-p)*100).toFixed(2)+'% 0 0)'; }
    else { chip.style.opacity=0; }
    $('chipEcho').style.opacity = f>=234 ? 1 : 0;

    // diagram + data
    const diag=f>=240&&f<345;
    $('diagram').style.opacity=diag?1:0; $('data').style.opacity=diag?1:0;
    $('dgroup').style.transform='scale('+punch(f).toFixed(5)+')';
    const dp = f<270 ? 0 : move(clamp((f-270)/30,0,1));
    traj.style.strokeDashoffset=(TL*(1-dp)).toFixed(2);
    $('earthdot').style.opacity = f>=315 ? 1 : 0;
    let peak=0; for(let k=240;k<=f;k++) peak=Math.max(peak, spring((k-240)/FPS,0.8,2));
    const secs = Math.min(207, Math.floor(207*peak)); // monotonic: a readout never counts backward
    $('dnum').textContent = Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');
    const splash=f>=315;
    $('dnum').style.display=splash?'none':'block'; $('dunit').style.display=splash?'none':'block'; $('dsplash').style.display=splash?'block':'none';
    $('dlabel').textContent = splash ? 'Splashdown' : 'Return powered flyby burn';

    // captions
    renderCaps(f);

    // lower third
    const lt=$('lt');
    if(active){ lt.style.display='block'; $('ltCredit').textContent=active.credit; $('ltDate').textContent=active.date; }
    else if(diag){ lt.style.display='block'; $('ltCredit').textContent='Diagram · flat line art'; $('ltDate').textContent='Not to scale'; }
    else lt.style.display='none';

    // end card: SIGNAL lands on the beat, DELAY echoes 5 frames later
    $('end').style.display = f>=345 ? 'block':'none';
    $('endDelay').style.visibility = f>=350 ? 'visible':'hidden';
    $('endEcho').style.opacity = f>=350 ? 1 : 0;
  }

  window.renderAt = function(t){ renderFrame(Math.min(359, Math.max(0, Math.round(t*FPS)))); };
  window.__ready = Promise.all([
    document.fonts.load("800 150px 'Archivo'"), document.fonts.load("700 88px 'Archivo'"), document.fonts.load("500 30px 'IBM Plex Mono'"),
    ...imgs.map(im=>im.decode().catch(()=>{}))
  ]).then(()=>document.fonts.ready);
  renderAt(0);
  const q=new URLSearchParams(location.search);
  if(!q.has('t')){
    let start=null;
    const loop=ts=>{ if(start===null) start=ts; renderAt(((ts-start)/1000)%12); requestAnimationFrame(loop); };
    window.__ready.then(()=>requestAnimationFrame(loop));
  }
})();
</script>
</body>
</html>
