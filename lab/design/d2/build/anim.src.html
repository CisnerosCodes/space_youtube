<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080, height=1920">
<title>Dispatch motion test</title>
<!--
  Direction 2, "Dispatch". 12 s, 30 fps, 1080x1920.
  Fonts: Google Fonts css2 API, family=Barlow+Condensed:wght@800, IBM+Plex+Mono:wght@500,
  Source+Serif+4:opsz,wght@8..60,600, display=block. The latin woff2 files that API serves are
  inlined below so the render needs no network. Photos: NASA, public domain, relative paths.
  Every frame is a pure function of t: window.renderAt(t).
-->
<style>
@font-face { font-family: 'Barlow Condensed'; font-style: normal; font-weight: 800; font-display: block;
  src: url(data:font/woff2;base64,{{FONT_BARLOW}}) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: block;
  src: url(data:font/woff2;base64,{{FONT_PLEX}}) format('woff2'); }
@font-face { font-family: 'Source Serif 4'; font-style: normal; font-weight: 200 900; font-display: block;
  src: url(data:font/woff2;base64,{{FONT_SERIF}}) format('woff2'); }

:root { --paper: #F3F0E8; --ink: #141414; --orange: #FF5A1F; --muted: #5E5A53; }
html, body { margin: 0; padding: 0; background: var(--paper); }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); color: var(--ink); }
.abs { position: absolute; }
.bar { position: absolute; background: var(--ink); }
.cond { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; text-transform: uppercase; white-space: nowrap; }
.mono { font-family: 'IBM Plex Mono', monospace; font-weight: 500; white-space: nowrap; }
.serif { font-family: 'Source Serif 4', serif; font-weight: 600; font-optical-sizing: auto; white-space: nowrap; }
.tab { position: absolute; height: 50px; box-sizing: border-box; padding: 6px 16px 10px 16px; background: var(--orange);
  font-size: 34px; line-height: 34px; }
.frame { position: absolute; overflow: hidden; background: var(--paper); }
.frame img { position: absolute; display: block; max-width: none; will-change: transform; }
.cap { position: absolute; left: 80px; top: 1196px; width: 820px; font-size: 86px; line-height: 103px; }
.cap > div { height: 103px; }
.cap span.w { opacity: 0; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">

  <!-- masthead (constant) -->
  <div class="abs cond" style="left: 80px; top: 256px; font-size: 44px; line-height: 44px; letter-spacing: 0.01em">SIGNAL DELAY</div>
  <div id="tabSmall" class="tab cond" style="left: 641px; top: 252px; width: 259px; text-align: center">LAUNCHING TODAY</div>
  <div class="bar" style="left: 80px; top: 302px; width: 1000px; height: 2px"></div>
  <div id="dateline" class="abs mono" style="left: 80px; top: 310px; font-size: 24px; line-height: 24px; color: var(--muted)"></div>

  <!-- FRONT layout: hook (frame 0) and end card -->
  <div id="front">
    <div id="frontTab" class="tab cond" style="left: 80px; top: 366px"></div>
    <div id="frontHead" class="abs cond" style="left: 80px; top: 432px; font-size: 168px; line-height: 148px; transform-origin: 0 80%"></div>
    <div id="frontEst" class="abs mono" style="left: 637px; top: 552px; font-size: 24px; line-height: 24px">EST</div>
    <div id="frontDeck" class="abs serif" style="left: 80px; top: 604px; font-size: 44px; line-height: 44px"></div>
    <div id="frontRule" class="bar" style="left: 80px; top: 680px; width: 1000px; height: 2px; transform-origin: 0 50%"></div>
    <div id="frontFrame" class="frame" style="left: 80px; top: 696px; width: 1000px; height: 728px"></div>
    <div class="bar" style="left: 80px; top: 696px; width: 1000px; height: 2px"></div>
    <div class="bar" style="left: 80px; top: 696px; width: 2px; height: 728px"></div>
    <div class="bar" style="left: 80px; top: 1422px; width: 1000px; height: 2px"></div>
  </div>

  <!-- STORY layout: framed print + caption band -->
  <div id="story">
    <div id="storyFrame" class="frame" style="left: 80px; top: 352px; width: 1000px; height: 800px">
      <svg id="diagram" class="abs" width="1000" height="800" viewBox="0 0 1000 800" aria-hidden="true" style="left: 0; top: 0">
        <circle cx="300" cy="560" r="150" fill="none" stroke="#141414" stroke-width="2"></circle>
        <line x1="150" y1="560" x2="450" y2="560" stroke="#141414" stroke-width="2"></line>
        <circle cx="800" cy="200" r="56" fill="none" stroke="#141414" stroke-width="2"></circle>
        <path id="trajectory" d="M 760 244 C 690 380 560 330 410 452" fill="none" stroke="#141414" stroke-width="4" stroke-linecap="butt"></path>
        <circle id="splashDot" cx="410" cy="452" r="10" fill="#141414"></circle>
      </svg>
    </div>
    <div class="bar" style="left: 80px; top: 352px; width: 1000px; height: 2px"></div>
    <div class="bar" style="left: 80px; top: 352px; width: 2px; height: 800px"></div>
    <div class="bar" style="left: 80px; top: 1150px; width: 1000px; height: 2px"></div>
    <div id="diagLabels">
      <div class="abs mono" style="left: 724px; top: 540px; font-size: 24px; line-height: 24px">MOON</div>
      <div class="abs mono" style="left: 344px; top: 880px; font-size: 24px; line-height: 24px; background: var(--paper); padding: 0 4px">EARTH</div>
      <div id="splashLabel" class="abs mono" style="left: 512px; top: 792px; font-size: 24px; line-height: 24px">SPLASHDOWN · PACIFIC OCEAN</div>
    </div>
  </div>

  <!-- NUMBER layout -->
  <div id="number">
    <div class="abs mono" style="left: 80px; top: 476px; font-size: 24px; line-height: 24px">RETURN POWERED FLYBY BURN</div>
    <div id="numRule" class="bar" style="left: 80px; top: 514px; width: 1000px; height: 2px; transform-origin: 0 50%"></div>
    <div id="numValue" class="abs cond" style="left: 80px; top: 550px; font-size: 400px; line-height: 352px; font-variant-numeric: tabular-nums">0:00</div>
    <div class="abs mono" style="left: 770px; top: 476px; font-size: 24px; line-height: 24px">MIN : SEC</div>
    <div class="abs" style="left: 80px; top: 950px; width: 820px; height: 2px; background: var(--muted)"></div>
    <div id="numBar" class="bar" style="left: 80px; top: 945px; width: 820px; height: 12px; transform-origin: 0 50%"></div>
    <div id="ticks"></div>
    <div class="abs mono" style="left: 80px; top: 984px; font-size: 24px; line-height: 24px">0:00</div>
    <div class="abs mono" style="left: 838px; top: 984px; font-size: 24px; line-height: 24px">3:27</div>
  </div>

  <!-- headline in the caption band (DAY 20.) -->
  <div id="bandHead" class="abs cond" style="left: 80px; top: 1196px; font-size: 168px; line-height: 148px; transform-origin: 0 80%">DAY 20.</div>

  <!-- caption blocks are built per shot -->
  <div id="caps"></div>
  <div id="underline" class="abs" style="left: 0; top: 0; width: 1px; height: 8px; background: var(--orange); transform-origin: 0 0"></div>

  <!-- signal delay chip -->
  <div id="chip" class="abs" style="left: 80px; top: 1124px; height: 58px; box-sizing: border-box; display: flex; align-items: stretch; background: var(--paper); border: 2px solid var(--ink)">
    <div style="width: 12px; background: var(--orange)"></div>
    <div class="mono" style="padding: 14px 20px 14px 18px; font-size: 26px; line-height: 26px">SIGNAL DELAY · MOON 1.3 s</div>
  </div>

  <!-- lower third (constant position) -->
  <div id="ltRule" class="bar" style="left: 80px; top: 1440px; width: 1000px; height: 2px; transform-origin: 0 50%"></div>
  <div id="credit" class="abs mono" style="left: 80px; top: 1452px; font-size: 24px; line-height: 24px"></div>

</div>

<script>
(() => {
'use strict';
const FPS = 30;

// ---------- motion tokens ----------
function bezier(p1x, p1y, p2x, p2y) {
  const cx = 3 * p1x, bx = 3 * (p2x - p1x) - cx, ax = 1 - cx - bx;
  const cy = 3 * p1y, by = 3 * (p2y - p1y) - cy, ay = 1 - cy - by;
  const sx = (t) => ((ax * t + bx) * t + cx) * t;
  const sy = (t) => ((ay * t + by) * t + cy) * t;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let lo = 0, hi = 1, t = x;
    for (let i = 0; i < 40; i++) { t = (lo + hi) / 2; if (sx(t) < x) lo = t; else hi = t; }
    return sy(t);
  };
}
const ENTER = bezier(0.16, 1, 0.3, 1);   // snap, ease-out-expo feel
const MOVE = bezier(0.76, 0, 0.24, 1);
const clamp01 = (x) => (x < 0 ? 0 : x > 1 ? 1 : x);
function spring(t, zeta, f) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - zeta * zeta);
  return 1 - Math.exp(-zeta * w * t) * (Math.cos(wd * t) + (zeta * w / wd) * Math.sin(wd * t));
}

// ---------- copy ----------
const D_LAUNCH = 'WED 16 NOV 2022 · KENNEDY SPACE CENTER';
const D_DAY20 = 'MON 5 DEC 2022 · ORION, FLIGHT DAY 20';
const D_SPLASH = 'SUN 11 DEC 2022 · PACIFIC OCEAN';
const D_END = 'DAILY · SOURCE ON SCREEN';
const C_KOWSKY_PAD = 'PHOTO NASA / JOEL KOWSKY — LAUNCH PAD 39B';
const C_INGALLS_PAD = 'PHOTO NASA / BILL INGALLS — LAUNCH PAD 39B';
const C_KOWSKY_KSC = 'PHOTO NASA / JOEL KOWSKY — KENNEDY SPACE CENTER';
const C_DAY20 = 'PHOTO NASA — ORION, FLIGHT DAY 20';
const C_SOURCE = 'SOURCE NASA — ARTEMIS I, FLIGHT DAY 20';
const C_DIAGRAM = 'DIAGRAM — NOT TO SCALE';

const IMG = (id) => '../../assets/nasa/' + id + '.jpg';

// a, b: first frame and end frame (exclusive). Cuts all land on multiples of 15.
const SHOTS = [
  { a: 0, b: 30, layout: 'front', photo: 'NHQ202211160030', fx: 0.40, fy: 0.15, ox: 0.40, oy: 0.40,
    push: [1.015, 1.045], slide: null, punch: 15, credit: C_KOWSKY_PAD, dateline: D_LAUNCH,
    front: { tab: 'LAUNCHING TODAY', head: '1:47 A.M.', size: 168, est: true, deck: 'Artemis I lifts off from Launch Pad 39B.' } },
  { a: 30, b: 60, layout: 'story', photo: 'NHQ202211160200', fx: 0.5, fy: 0.5, ox: 0.5, oy: 0.5,
    push: [1, 1.03], slide: [1, 0], credit: C_INGALLS_PAD, dateline: D_LAUNCH,
    words: [['Launch', 30, 0], ['Pad', 38, 0], ['39B.', 45, 0]] },
  { a: 60, b: 105, layout: 'story', photo: 'NHQ202211160022', fx: 0.5, fy: 0.85, ox: 0.5, oy: 0.82,
    push: [1, 1.03], slide: [0, 1], punch: 90, credit: C_KOWSKY_PAD, dateline: D_LAUNCH,
    words: [['Artemis', 60, 0], ['I', 68, 0], ['lifts', 75, 0], ['off.', 83, 0]] },
  { a: 105, b: 150, layout: 'story', photo: 'NHQ202211160003', fx: 0.5, fy: 0.035, ox: 0.5, oy: 0.3,
    push: [1, 1.03], slide: [0, 1], credit: C_KOWSKY_PAD, dateline: D_LAUNCH,
    words: [['SLS', 105, 0], ['and', 113, 0], ['Orion', 120, 0], ['fly', 135, 1], ['together', 143, 1]] },
  { a: 150, b: 180, layout: 'story', photo: 'NHQ202211160019', fx: 0.5, fy: 0.1, ox: 0.6, oy: 0.3,
    push: [1, 1.03], slide: [1, 0], credit: C_KOWSKY_KSC, dateline: D_LAUNCH,
    words: [['for', 150, 0], ['the', 158, 0], ['first', 165, 0], ['time.', 173, 0]] },
  { a: 180, b: 240, layout: 'story', photo: 'art001e002083', fx: 1, fy: 0.5, ox: 0.75, oy: 0.45,
    push: [1, 1.03], slide: [1, 0], credit: C_DAY20, dateline: D_DAY20, bandHead: [180, 195], chip: 184,
    words: [['Earth', 195, 0], ['rises', 203, 0], ['behind', 210, 1], ['the', 218, 1], ['Moon.', 225, 1]] },
  { a: 240, b: 270, layout: 'number', credit: C_SOURCE, dateline: D_DAY20,
    words: [['A', 240, 0], ['3-minute,', 248, 0], ['27-second', 255, 1], ['burn', 263, 1]] },
  { a: 270, b: 315, layout: 'story', photo: 'art001e002083', crop: { s: 1, left: -920, top: -400 }, ox: 0.685, oy: 0.48,
    push: [1, 1.03], slide: [1, 0], punch: 300, credit: C_DAY20, dateline: D_DAY20,
    words: [['sends', 270, 0], ['Orion', 278, 0], ['home.', 285, 0]] },
  { a: 315, b: 345, layout: 'diagram', slide: [1, 0], credit: C_DIAGRAM, dateline: D_SPLASH,
    words: [['Splashdown:', 315, 0], ['Dec.', 323, 0], ['11.', 330, 0]] },
  { a: 345, b: 360, layout: 'front', photo: 'NHQ202211160030', fx: 0.40, fy: 0.15, ox: 0.40, oy: 0.40,
    push: [1.0, 1.015], slide: [0, 1], credit: C_KOWSKY_PAD, dateline: D_END, stamp: 345,
    front: { tab: '@SIGNALDELAYHQ', head: 'SIGNAL DELAY', size: 156, est: false, deck: 'One real space story a day, sourced.' } },
];

const SLIDE = 48;            // px, hero snap travel (max 60)
const SNAP = 8;              // frames
const STAMP = 5;             // frames, 1.04 -> 1.00
const RULE = 6;              // frames
const PUNCH = 0.05;          // +5 percent, 6 frames
const BURN_S = 207;          // 3 min 27 s
const CAP_TOP = 1196, CAP_LH = 103, CAP_BASE = 81.5, UL_GAP = 22;

const $ = (id) => document.getElementById(id);
const el = {};
['front', 'frontTab', 'frontHead', 'frontEst', 'frontDeck', 'frontRule', 'frontFrame', 'story', 'storyFrame', 'diagram',
 'trajectory', 'splashDot', 'diagLabels', 'splashLabel', 'number', 'numRule', 'numValue', 'numBar', 'ticks', 'bandHead',
 'caps', 'underline', 'chip', 'ltRule', 'credit', 'dateline', 'tabSmall'].forEach((k) => { el[k] = $(k); });

// ---------- build ----------
// burn scale ticks at 0, 1, 2, 3 min and at the end
[0, 60, 120, 180, BURN_S].forEach((s) => {
  const d = document.createElement('div');
  d.className = 'bar';
  d.style.cssText = `left:${80 + 820 * s / BURN_S - (s === BURN_S ? 2 : 0)}px; top:934px; width:2px; height:34px`;
  el.ticks.appendChild(d);
});

SHOTS.forEach((s, i) => {
  s.i = i;
  if (s.photo) {
    const img = new Image();
    img.decoding = 'sync';
    img.alt = '';
    img.src = IMG(s.photo);
    (s.layout === 'front' ? el.frontFrame : el.storyFrame).appendChild(img);
    s.img = img;
  }
  if (s.words) {
    const block = document.createElement('div');
    block.className = 'cap serif';
    const lines = [document.createElement('div'), document.createElement('div')];
    lines.forEach((l) => block.appendChild(l));
    s.spans = s.words.map(([w, f, line], j) => {
      const sp = document.createElement('span');
      sp.className = 'w';
      sp.textContent = w;
      const L = lines[line];
      if (L.childNodes.length) L.appendChild(document.createTextNode(' '));
      L.appendChild(sp);
      return sp;
    });
    el.caps.appendChild(block);
    s.block = block;
  }
});

function placePhoto(s) {
  const frame = s.layout === 'front' ? { W: 1000, H: 728 } : { W: 1000, H: 800 };
  const iw = s.img.naturalWidth, ih = s.img.naturalHeight;
  let w, h, left, top;
  if (s.crop) {
    w = iw * s.crop.s; h = ih * s.crop.s; left = s.crop.left; top = s.crop.top;
  } else {
    const k = Math.max(frame.W / iw, frame.H / ih);
    w = iw * k; h = ih * k;
    left = (frame.W - w) * s.fx; top = (frame.H - h) * s.fy;
  }
  Object.assign(s.img.style, { left: left + 'px', top: top + 'px', width: w + 'px', height: h + 'px',
    transformOrigin: `${s.ox * frame.W - left}px ${s.oy * frame.H - top}px` });
}

function measureWords(s) {
  s.rects = s.words.map(([, , line], j) => {
    const sp = s.spans[j];
    return { x: 80 + sp.offsetLeft, w: sp.offsetWidth, y: CAP_TOP + line * CAP_LH + CAP_BASE + UL_GAP };
  });
}

let trajLen = 0;

window.__ready = (async () => {
  await Promise.all([
    document.fonts.load("800 100px 'Barlow Condensed'"),
    document.fonts.load("500 24px 'IBM Plex Mono'"),
    document.fonts.load("600 86px 'Source Serif 4'"),
  ]);
  await document.fonts.ready;
  await Promise.all(SHOTS.filter((s) => s.img).map((s) => s.img.decode().catch(() => {})));
  SHOTS.forEach((s) => { if (s.img) placePhoto(s); });
  // caption blocks must be displayed to be measured
  SHOTS.forEach((s) => { if (s.block) { s.block.classList.remove('hidden'); measureWords(s); s.block.classList.add('hidden'); } });
  trajLen = el.trajectory.getTotalLength();
  el.trajectory.style.strokeDasharray = trajLen + ' ' + trajLen;
  window.renderAt(currentT);
})();

const show = (node, on) => node.classList.toggle('hidden', !on);
let currentT = 0;

// ---------- frame function ----------
window.renderAt = function renderAt(t) {
  currentT = t;
  const f = t * FPS + 1e-6;               // continuous frame
  const fi = Math.floor(f);                // integer frame for step events
  const s = SHOTS.find((x) => fi >= x.a && fi < x.b) || SHOTS[SHOTS.length - 1];
  const lf = f - s.a;                      // frames into the shot

  el.dateline.textContent = s.dateline;
  el.credit.textContent = s.credit;

  // layouts
  show(el.front, s.layout === 'front');
  show(el.story, s.layout === 'story' || s.layout === 'diagram');
  show(el.number, s.layout === 'number');
  show(el.tabSmall, s.layout !== 'front');
  show(el.diagram, s.layout === 'diagram');
  show(el.diagLabels, s.layout === 'diagram');

  // photos: only the shot's own image is visible
  SHOTS.forEach((x) => { if (x.img) show(x.img, x === s); });
  if (s.img) {
    let dx = 0, dy = 0;
    if (s.slide) {
      const r = 1 - ENTER(clamp01(lf / SNAP));
      dx = s.slide[0] * SLIDE * r; dy = s.slide[1] * SLIDE * r;
    }
    let k = s.push[0] + (s.push[1] - s.push[0]) * clamp01(lf / (s.b - s.a));
    if (s.punch != null) k *= 1 + PUNCH * ENTER(clamp01((f - s.punch) / 6));
    s.img.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) scale(${k.toFixed(5)})`;
  }

  // diagram: snaps like a print, then the return path draws
  if (s.layout === 'diagram') {
    const r = 1 - ENTER(clamp01(lf / SNAP));
    el.diagram.style.transform = `translate(${(SLIDE * r).toFixed(2)}px, 0px)`;
    const p = ENTER(clamp01((f - 315) / 12));
    el.trajectory.style.strokeDashoffset = (trajLen * (1 - p)).toFixed(2);
    show(el.splashDot, fi >= 327);
    show(el.splashLabel, fi >= 330);
  }

  // front layout (hook and end card)
  if (s.layout === 'front') {
    el.frontTab.textContent = s.front.tab;
    el.frontHead.textContent = s.front.head;
    el.frontHead.style.fontSize = s.front.size + 'px';
    el.frontDeck.textContent = s.front.deck;
    show(el.frontEst, s.front.est);
    const st = s.stamp != null ? 1 + 0.04 * (1 - ENTER(clamp01((f - s.stamp) / STAMP))) : 1;
    el.frontHead.style.transform = `scale(${st.toFixed(4)})`;
    const rr = s.stamp != null ? ENTER(clamp01((f - s.stamp - 4) / RULE)) : 1;
    el.frontRule.style.transform = `scaleX(${rr.toFixed(4)})`;
  }

  // number layout: count-up on a spring, display capped at the true value
  if (s.layout === 'number') {
    const sp = Math.min(1, spring(lf / FPS, 0.8, 2));
    const v = Math.min(BURN_S, Math.round(BURN_S * sp));
    el.numValue.textContent = Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0');
    el.numBar.style.transform = `scaleX(${(v / BURN_S).toFixed(4)})`;
    el.numRule.style.transform = `scaleX(${ENTER(clamp01((lf - 4) / RULE)).toFixed(4)})`;
  }

  // lower-third rule draws across 4 frames after each cut (secondary), complete on frame 0
  const lr = s.a === 0 ? 1 : ENTER(clamp01((lf - 4) / RULE));
  el.ltRule.style.transform = `scaleX(${lr.toFixed(4)})`;

  // DAY 20. headline stamp in the caption band
  const bh = s.bandHead && fi >= s.bandHead[0] && fi < s.bandHead[1];
  show(el.bandHead, !!bh);
  if (bh) {
    const st = 1 + 0.04 * (1 - ENTER(clamp01((f - s.bandHead[0]) / STAMP)));
    el.bandHead.style.transform = `scale(${st.toFixed(4)})`;
  }

  // chip: snaps in from the left, 60 percent of the hero travel, 4 frames after the stamp
  const chipOn = s.chip != null && fi >= s.chip;
  show(el.chip, chipOn);
  if (chipOn) {
    const r = 1 - ENTER(clamp01((f - s.chip) / SNAP));
    el.chip.style.transform = `translate(${(-SLIDE * 0.6 * r).toFixed(2)}px, 0px)`;
  }

  // captions: words cut in one by one; the orange underline jumps to the current word
  SHOTS.forEach((x) => { if (x.block) show(x.block, x === s); });
  let cur = -1;
  if (s.words) {
    s.words.forEach(([, wf], j) => {
      const on = fi >= wf;
      s.spans[j].style.opacity = on ? '1' : '0';
      if (on) cur = j;
    });
  }
  show(el.underline, cur >= 0 && !!s.rects);
  if (cur >= 0 && s.rects) {
    let R = s.rects[cur];
    if (cur > 0) {
      const p = ENTER(clamp01((f - s.words[cur][1] + 1) / 3));
      const P = s.rects[cur - 1];
      R = { x: P.x + (R.x - P.x) * p, y: P.y + (R.y - P.y) * p, w: P.w + (R.w - P.w) * p };
    }
    el.underline.style.transform = `translate(${R.x.toFixed(2)}px, ${R.y.toFixed(2)}px) scaleX(${R.w.toFixed(2)})`;
  }
};

// initial paint; then preview loop only when no ?t= is given
window.renderAt(0);
