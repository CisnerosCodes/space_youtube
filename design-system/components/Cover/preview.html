<!-- @dsCard height=300 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=block">
<style>
body{margin:0;background:var(--ink,#0b0b0c)}
.cover{position:relative;width:960px;height:300px;background:var(--ink,#0b0b0c);overflow:hidden}
.ink-raise{fill:#1a1a1c}
.amber{fill:var(--amber,#f5b83d)}
.paper{fill:var(--paper,#f2efe8)}
.muted{fill:var(--muted,#8c8a85)}
.ring{fill:none;stroke:var(--amber,#f5b83d);stroke-width:14}
.ring-ink{fill:none;stroke:var(--ink,#0b0b0c);stroke-width:14}
.tick{fill:var(--amber,#f5b83d)}
.tick-off{fill:var(--paper,#f2efe8);fill-opacity:.3}
svg{position:absolute;left:0;top:0}
.name{position:absolute;left:40px;bottom:64px;margin:0;font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-stretch:112%;font-size:104px;line-height:.95;color:var(--paper,#f2efe8);max-width:440px}
.tag{position:absolute;left:40px;bottom:32px;margin:0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:13px;color:var(--muted,#8c8a85);max-width:440px}
</style>
</head>
<body>
<div class="cover">
  <svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
    <!-- blocks: amber slab 176x300 (22 x space-unit), paper block 104x120, raised ink block 216x176; all radius-none -->
    <!-- arrangement: one tall amber slab bleeding off the top and bottom with two satellites, all right of x 480 -->
    <!-- pattern: the literal motif, the echo mark (a solid dot and its delayed hollow ring, radius-round), cut across the slab and the ink block, plus the seven progress ticks; chosen because the dot and its echo is the channel's own name drawn as shapes -->
    <!-- steps: space-unit 8px multiples for every size and gap, tick-height 6px, tick-gap 8px, radius-none for blocks, radius-round for the dot and ring -->
    <rect class="ink-raise" x="520" y="96" width="216" height="176"/>
    <rect class="amber" x="752" y="0" width="176" height="300"/>
    <rect class="paper" x="520" y="0" width="104" height="80"/>
    <circle class="paper" cx="640" cy="184" r="56"/>
    <circle class="ring-ink" cx="840" cy="184" r="49"/>
    <rect class="tick" x="520" y="284" width="56" height="6"/>
    <rect class="tick" x="584" y="284" width="56" height="6"/>
    <rect class="tick" x="648" y="284" width="56" height="6"/>
    <rect class="tick-off" x="712" y="284" width="32" height="6"/>
  </svg>
  <p class="name">Signal<br>Delay</p>
  <p class="tag">One real space story a day, explained in under a minute.</p>
</div>
<script></script>
</body>
</html>
