<!-- @dsCard group="Shorts beats" height=560 subtitle="The closing card of every Short: a real, dated event next. 40% scale" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@500&display=block">
<style>
body{margin:0;background:#26272b}
.f{position:relative;width:432px;height:540px;background:var(--ink,#0b0b0c);overflow:hidden;margin:10px}
.ticks{position:absolute;left:32px;top:24px;width:368px;display:flex;gap:3px}
.ticks i{flex:1;height:2px;background:var(--amber,#f5b83d)}
.k{position:absolute;left:32px;top:36px;display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:11px;line-height:14px;color:var(--paper,#f2efe8);text-transform:uppercase}
.k svg{width:11px;height:11px}
.h{position:absolute;left:32px;top:72px;width:330px;font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-stretch:112%;font-size:35px;line-height:34px;color:var(--paper,#f2efe8);text-transform:uppercase}
.date{position:absolute;left:32px;top:218px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:26px;color:var(--amber,#f5b83d)}
.ptr{position:absolute;left:32px;top:262px;display:inline-flex;align-items:center;gap:5px;outline:1px solid var(--amber,#f5b83d);padding:3px 6px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:11px;color:var(--paper,#f2efe8)}
.ptr svg{width:11px;height:11px}
.dg{position:absolute;right:28px;top:330px;width:170px;height:90px}
.dl{position:absolute;right:28px;top:424px;font-family:"IBM Plex Mono",ui-monospace,monospace;font-weight:500;font-size:9px;letter-spacing:.05em;color:var(--muted,#8c8a85)}
.wm{position:absolute;left:32px;top:470px;display:inline-flex;align-items:center;gap:10px;font-family:"Archivo",system-ui,sans-serif;font-weight:800;font-stretch:125%;font-size:26px;line-height:1;color:var(--paper,#f2efe8)}
.wm svg{height:18px;width:auto}
.wm b{color:var(--amber,#f5b83d);font-weight:800}
</style>
</head>
<body>
<div class="f">
  <div class="ticks"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <span class="k"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3 L26 25 H2 Z" fill="#f5b83d"/></svg>Next on Launch Day</span>
  <div class="h">Japan's MMX launches for the moons of Mars.</div>
  <div class="date">MON 19 OCT</div>
  <span class="ptr"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M3 14 H23 M15 6 L23 14 L15 22" fill="none" stroke="#f5b83d" stroke-width="3"/></svg>This week in space · Sunday</span>
  <svg class="dg" viewBox="0 0 170 90" role="img" aria-label="Diagram, not to scale: a spacecraft path toward Mars and its two moons' orbits">
    <path d="M0 30 C40 22 70 26 98 40" fill="none" stroke="#f5b83d" stroke-width="1.5" stroke-dasharray="3 4"/>
    <ellipse cx="120" cy="52" rx="44" ry="20" fill="none" stroke="#f5b83d" stroke-width="1.5"/>
    <ellipse cx="120" cy="52" rx="30" ry="13" fill="none" stroke="#f5b83d" stroke-width="1.5"/>
    <circle cx="120" cy="52" r="10" fill="none" stroke="#f5b83d" stroke-width="1.5"/>
    <rect x="96" y="36" width="5" height="5" fill="#f2efe8"/>
  </svg>
  <span class="dl">DIAGRAM · NOT TO SCALE</span>
  <span class="wm"><svg viewBox="0 0 104 44" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="#f5b83d"/><circle cx="82" cy="22" r="19" fill="none" stroke="#f5b83d" stroke-width="6"/></svg>SIGNAL <b>DELAY</b></span>
</div>
<script></script>
</body>
</html>
